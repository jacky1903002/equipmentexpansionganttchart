<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機台擴張甘特圖管理系統 - 雲端商業版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Firebase SDK (Compat 版本，最適合單一 HTML 快速導入) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans antialiased">

    <div class="flex flex-col min-h-screen">
        <header class="bg-white shadow px-6 py-4 flex justify-between items-center border-b">
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <span>☁️</span> 機台擴張甘特圖管理系統 <span class="text-xs bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded font-normal">雲端同步版</span>
            </h1>
            <div class="flex items-center space-x-4">
                <span id="sync-status" class="text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-medium">⏳ 正在連線至雲端...</span>
            </div>
        </header>

        <!-- 分頁與工作表操作 -->
        <div class="bg-white border-b px-6 py-3 flex flex-wrap items-center justify-between gap-4">
            <div id="sheets-tabs" class="flex items-center space-x-2 overflow-x-auto pb-1"></div>
            <div class="flex items-center space-x-2">
                <button onclick="addNewSheet()" class="bg-emerald-600 text-white px-3.5 py-1.5 rounded-lg text-sm hover:bg-emerald-700 transition shadow-sm">+ 新增工作表</button>
                <button onclick="deleteCurrentSheet()" class="bg-rose-500 text-white px-3.5 py-1.5 rounded-lg text-sm hover:bg-rose-600 transition shadow-sm">刪除工作表</button>
            </div>
        </div>

        <!-- 檔案與截圖匯出列 -->
        <div class="bg-gray-50 px-6 py-3 border-b flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <label class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm cursor-pointer hover:bg-indigo-700 transition shadow-sm flex items-center gap-1.5 font-medium">
                    📁 匯入 Excel <input type="file" id="excel-file-input" class="hidden" accept=".xlsx, .xls, .csv" onchange="importExcel(event)">
                </label>
                <button onclick="exportExcel()" class="bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm hover:bg-emerald-800 transition shadow-sm font-medium">📥 匯出 Excel</button>
            </div>
        </div>

        <!-- 主內容區 -->
        <main class="flex-1 p-6 space-y-6 bg-gray-100">
            <!-- 資料表格編輯區 -->
            <div class="bg-white rounded-xl shadow-sm border p-4 overflow-x-auto">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="current-sheet-title" class="text-base font-bold text-gray-800">工作表名稱</h3>
                    <div class="space-x-2">
                        <button onclick="addColumn()" class="bg-blue-600 text-white px-3 py-1 rounded text-xs hover:bg-blue-700 transition">+ 新增欄位</button>
                        <button onclick="addRow()" class="bg-purple-600 text-white px-3 py-1 rounded text-xs hover:bg-purple-700 transition">+ 新增列位</button>
                    </div>
                </div>
                <div class="max-h-96 overflow-y-auto border rounded-lg">
                    <table id="data-table" class="min-w-full divide-y divide-gray-200 text-xs">
                        <!-- 動態渲染表格 -->
                    </table>
                </div>
            </div>

            <!-- 甘特圖預覽區 -->
            <div id="gantt-export-area" class="bg-white rounded-xl shadow-sm border p-6 relative">
                <div class="flex justify-between items-center mb-4 flex-wrap gap-3">
                    <h3 class="text-base font-bold text-gray-800">📈 甘特圖與月份矩陣預覽</h3>
                    <div class="flex items-center space-x-4 flex-wrap gap-2">
                        <div class="flex items-center space-x-3 text-xs bg-gray-50 px-3 py-1.5 rounded-lg border">
                            <span class="flex items-center"><span class="w-3 h-3 bg-sky-200 border border-sky-400 inline-block mr-1 rounded"></span>計畫</span>
                            <span class="flex items-center"><span class="w-3 h-3 bg-emerald-500 inline-block mr-1 rounded"></span>實際正常</span>
                            <span class="flex items-center"><span class="w-3 h-3 bg-rose-500 inline-block mr-1 rounded"></span>實際落後</span>
                            <span class="flex items-center"><span class="w-3 h-3 bg-purple-600 inline-block mr-1 rounded"></span>已完成</span>
                        </div>
                        <button id="export-btn" onclick="exportGanttPNG()" class="bg-blue-600 text-white px-3.5 py-1.5 rounded-lg text-xs hover:bg-blue-700 transition shadow-sm font-medium">匯出甘特圖 PNG</button>
                    </div>
                </div>
                <div id="gantt-container" class="space-y-4 overflow-x-auto py-2"></div>
            </div>
        </main>
    </div>

    <!-- 雲端與應用程式邏輯 -->
    <script>
        // ==========================================
        // 請在此處填入您從 Firebase 拿到的設定值
        // ==========================================
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyC0sT-i0AwNH9utv5JFVZ1HfXXoRDVQyYs",
  authDomain: "equipmentexpansionganttchart.firebaseapp.com",
  databaseURL: "https://equipmentexpansionganttchart-default-rtdb.firebaseio.com",
  projectId: "equipmentexpansionganttchart",
  storageBucket: "equipmentexpansionganttchart.firebasestorage.app",
  messagingSenderId: "357406784955",
  appId: "1:357406784955:web:e3661233994a32196e589e",
  measurementId: "G-HYXNC4YZ19"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let appData = {
            sheets: [
                {
                    name: "機台擴張排程",
                    columns: ["部門", "課別", "機台", "類別", "開始日期", "完成日期", "Jan-26", "Feb-26", "Mar-26", "Apr-26", "May-26", "Jun-26", "Jul-26", "Aug-26", "Sep-26", "Oct-26", "Nov-26", "Dec-26"],
                    rows: [
                        ["製造一部", "金屬一課", "自動化銑床1:4", "計畫", "2026/1/1", "2026/8/15", "1", "1", "1", "1", "1", "1", "1", "1", "", "", "", ""],
                        ["製造一部", "金屬一課", "自動化銑床1:4", "實際", "2026/3/1", "", "", "", "", "1", "1", "1", "1", "1", "1", "", "", "", ""]
                    ]
                }
            ]
        };
        let currentSheetIndex = 0;
        let isSaving = false;

        window.addEventListener('DOMContentLoaded', () => {
            loadFromCloud();
        });

        // 從雲端 Firestore 載入資料
        function loadFromCloud() {
            const statusEl = document.getElementById('sync-status');
            db.collection("ganttSystem").doc("mainData").get().then((doc) => {
                if (doc.exists && doc.data().sheets) {
                    appData = doc.data();
                    statusEl.className = "text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-medium";
                    statusEl.innerText = "✅ 已連線雲端 (同步完成)";
                } else {
                    // 若雲端沒有資料，寫入預設資料
                    saveToCloud();
                }
                renderApp();
            }).catch((error) => {
                console.error("載入雲端資料失敗:", error);
                statusEl.className = "text-xs bg-rose-100 text-rose-800 px-2.5 py-1 rounded-full font-medium";
                statusEl.innerText = "❌ 雲端連線失敗 (請檢查設定)";
                renderApp(); // 降級使用預設
            });
        }

        // 儲存資料到雲端 Firestore
        function saveToCloud() {
            const statusEl = document.getElementById('sync-status');
            statusEl.className = "text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-medium";
            statusEl.innerText = "💾 正在同步至雲端...";

            db.collection("ganttSystem").doc("mainData").set(appData)
                .then(() => {
                    statusEl.className = "text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-medium";
                    statusEl.innerText = "✅ 已連線雲端 (同步完成)";
                })
                .catch((error) => {
                    console.error("儲存至雲端失敗:", error);
                    statusEl.className = "text-xs bg-rose-100 text-rose-800 px-2.5 py-1 rounded-full font-medium";
                    statusEl.innerText = "❌ 雲端儲存失敗";
                });
        }

        function renderApp() {
            renderSheetsTabs();
            renderTable();
            renderGanttChart();
        }

        function renderSheetsTabs() {
            const container = document.getElementById('sheets-tabs');
            container.innerHTML = '';
            appData.sheets.forEach((sheet, idx) => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-1.5 rounded-lg text-sm font-semibold transition shadow-sm ${idx === currentSheetIndex ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`;
                btn.innerText = sheet.name;
                btn.onclick = () => { currentSheetIndex = idx; renderApp(); };
                btn.ondblclick = () => {
                    const newName = prompt("重新命名工作表：", sheet.name);
                    if (newName && newName.trim() !== "") {
                        sheet.name = newName.trim();
                        saveToCloud();
                        renderApp();
                    }
                };
                container.appendChild(btn);
            });
            document.getElementById('current-sheet-title').innerText = appData.sheets[currentSheetIndex].name;
        }

        function addNewSheet() {
            const name = prompt("請輸入新工作表名稱：", `工作表 ${appData.sheets.length + 1}`);
            if (!name) return;
            appData.sheets.push({
                name: name.trim(),
                columns: ["部門", "課別", "機台", "類別", "開始日期", "完成日期", "Jan-26", "Feb-26"],
                rows: [["部門A", "課別A", "機台A", "計畫", "2026/01/01", "2026/02/01", "1", "1"]]
            });
            currentSheetIndex = appData.sheets.length - 1;
            saveToCloud();
            renderApp();
        }

        function deleteCurrentSheet() {
            if (appData.sheets.length <= 1) {
                alert("至少需要保留一個工作表！");
                return;
            }
            if (confirm(`確定要刪除工作表「${appData.sheets[currentSheetIndex].name}」嗎？`)) {
                appData.sheets.splice(currentSheetIndex, 1);
                currentSheetIndex = Math.max(0, currentSheetIndex - 1);
                saveToCloud();
                renderApp();
            }
        }

        function renderTable() {
            const sheet = appData.sheets[currentSheetIndex];
            const table = document.getElementById('data-table');
            let html = '<thead class="bg-gray-50 sticky top-0 z-10"><tr>';
            
            sheet.columns.forEach((col, cIdx) => {
                html += `<th class="px-3 py-2 text-left font-medium text-gray-600 uppercase tracking-wider border-b">
                    <div class="flex items-center space-x-1">
                        <input type="text" value="${col}" onchange="updateColumnName(${cIdx}, this.value)" class="bg-transparent border-b border-gray-300 focus:outline-none focus:border-blue-500 w-24 text-xs font-semibold">
                        <button onclick="deleteColumn(${cIdx})" class="text-red-500 hover:text-red-700 text-xs px-1">✕</button>
                    </div>
                </th>`;
            });
            html += '<th class="px-3 py-2 text-center font-medium text-gray-600 uppercase tracking-wider border-b">操作</th></tr></thead>';
            
            html += '<tbody class="bg-white divide-y divide-gray-200">';
            sheet.rows.forEach((row, rIdx) => {
                html += '<tr class="hover:bg-gray-50 transition">';
                sheet.columns.forEach((_, cIdx) => {
                    const val = row[cIdx] !== undefined ? row[cIdx] : '';
                    html += `<td class="px-3 py-1.5 whitespace-nowrap border-b">
                        <input type="text" value="${val}" oninput="updateCellInstant(${rIdx}, ${cIdx}, this.value)" onchange="updateCell(${rIdx}, ${cIdx}, this.value)" class="w-full bg-transparent focus:outline-none focus:ring-1 focus:ring-blue-500 px-1 rounded text-xs text-gray-800">
                    </td>`;
                });
                html += `<td class="px-3 py-1.5 whitespace-nowrap text-center border-b">
                    <button onclick="deleteRow(${rIdx})" class="text-red-600 hover:text-red-900 text-xs font-semibold">刪除</button>
                </td>`;
                html += '</tr>';
            });
            html += '</tbody>';
            table.innerHTML = html;
        }

        function updateColumnName(cIdx, val) {
            appData.sheets[currentSheetIndex].columns[cIdx] = val.trim();
            saveToCloud();
            renderApp();
        }

        function updateCellInstant(rIdx, cIdx, val) {
            appData.sheets[currentSheetIndex].rows[rIdx][cIdx] = val;
            renderGanttChart();
        }

        function updateCell(rIdx, cIdx, val) {
            appData.sheets[currentSheetIndex].rows[rIdx][cIdx] = val;
            saveToCloud();
            renderGanttChart();
        }

        function addColumn() {
            const colName = prompt("請輸入新欄位名稱：", `欄位 ${appData.sheets[currentSheetIndex].columns.length + 1}`);
            if (!colName) return;
            appData.sheets[currentSheetIndex].columns.push(colName.trim());
            appData.sheets[currentSheetIndex].rows.forEach(row => row.push(""));
            saveToCloud();
            renderApp();
        }

        function deleteColumn(cIdx) {
            if (appData.sheets[currentSheetIndex].columns.length <= 1) {
                alert("至少需要保留一個欄位！");
                return;
            }
            appData.sheets[currentSheetIndex].columns.splice(cIdx, 1);
            appData.sheets[currentSheetIndex].rows.forEach(row => row.splice(cIdx, 1));
            saveToCloud();
            renderApp();
        }

        function addRow() {
            const emptyRow = new Array(appData.sheets[currentSheetIndex].columns.length).fill("");
            appData.sheets[currentSheetIndex].rows.push(emptyRow);
            saveToCloud();
            renderApp();
        }

        function deleteRow(rIdx) {
            appData.sheets[currentSheetIndex].rows.splice(rIdx, 1);
            saveToCloud();
            renderApp();
        }

        function renderGanttChart() {
            const sheet = appData.sheets[currentSheetIndex];
            const container = document.getElementById('gantt-container');
            container.innerHTML = '';

            const today = new Date('2026-09-25');
            const monthCols = [];
            const monthNamesShort = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            
            sheet.columns.forEach((col, idx) => {
                let cStr = String(col || '').trim();
                let isMonthCol = false;
                let displayName = cStr;

                if (cStr.includes('-') || monthNamesShort.some(m => cStr.includes(m))) {
                    if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(cStr)) {
                        const parts = cStr.split('-');
                        const yr = parts[0].slice(-2);
                        const moIdx = parseInt(parts[1], 10) - 1;
                        if (moIdx >= 0 && moIdx < 12) {
                            displayName = `${monthNamesShort[moIdx]}-${yr}`;
                        }
                    }
                    isMonthCol = true;
                }
                if (isMonthCol) {
                    monthCols.push({ name: displayName, originalName: cStr, index: idx });
                }
            });

            const machineMap = {};
            sheet.rows.forEach(row => {
                const dept = row[0] || '';
                const clazz = row[1] || '';
                const machine = row[2] || '未命名機台';
                const key = `${dept}_${clazz}_${machine}`;
                if (!machineMap[key]) {
                    machineMap[key] = { dept, clazz, machine, items: [] };
                }
                machineMap[key].items.push(row);
            });

            Object.values(machineMap).forEach(group => {
                const div = document.createElement('div');
                div.className = 'border rounded-xl p-4 bg-gray-50 flex flex-col gap-3 shadow-sm';
                
                let headerInfo = `<div class="text-xs font-bold text-gray-700 flex items-center gap-2">
                    <span class="bg-gray-200 px-2 py-0.5 rounded text-gray-700">${group.dept}</span> / 
                    <span class="bg-gray-200 px-2 py-0.5 rounded text-gray-700">${group.clazz}</span> / 
                    <span class="text-blue-600 text-sm font-extrabold">${group.machine}</span>
                </div>`;
                
                let planItem = null;
                let actualItem = null;

                group.items.forEach(row => {
                    const type = String(row[3] || '');
                    if (type.includes('計畫')) planItem = row;
                    else if (type.includes('實際')) actualItem = row;
                });

                let planStart = planItem ? String(planItem[4] || '') : '';
                let planEnd = planItem ? String(planItem[5] || '') : '';
                let actualStart = actualItem ? String(actualItem[4] || '') : '';
                let actualEnd = actualItem ? String(actualItem[5] || '') : '';
                let hasActualEnd = actualEnd && actualEnd.trim() !== '';
                
                let isDelayed = false;
                if (actualItem) {
                    const typeStr = String(actualItem[3] || '');
                    if (typeStr.includes('落後')) {
                        isDelayed = true;
                    } else if (planStart && actualStart && actualStart > planStart) {
                        isDelayed = true;
                    } else if (hasActualEnd && planEnd && actualEnd > planEnd) {
                        isDelayed = true;
                    } else if (!hasActualEnd && planEnd) {
                        const pEndDate = new Date(planEnd);
                        if (!isNaN(pEndDate) && pEndDate < today) {
                            isDelayed = true;
                        }
                    }
                }

                let isCompleted = hasActualEnd && !isDelayed;
                let contentHtml = '<div class="space-y-2 pl-3 border-l-2 border-blue-400">';

                if (planItem) {
                    contentHtml += `<div class="flex items-center space-x-2">
                        <span class="px-2 py-0.5 rounded text-xs font-semibold bg-sky-200 text-sky-900 border border-sky-400">計畫</span>
                        <span class="text-xs text-gray-600 font-medium">${planStart} ~ ${planEnd}</span>
                    </div>`;
                }

                if (actualItem) {
                    let actualBadgeClass = 'bg-emerald-500 text-white';
                    let actualLabel = '實際';
                    if (isDelayed) {
                        actualBadgeClass = 'bg-rose-500 text-white';
                        actualLabel = hasActualEnd ? '實際 (落後/延後)' : '實際 (未完工/落後)';
                    } else if (isCompleted) {
                        actualBadgeClass = 'bg-purple-600 text-white';
                        actualLabel = '實際 (已完成)';
                    }
                    let actualDateStr = hasActualEnd ? `${actualStart} ~ ${actualEnd}` : `${actualStart} ~ (未完工)`;
                    contentHtml += `<div class="flex items-center space-x-2 mt-1">
                        <span class="px-2 py-0.5 rounded text-xs font-semibold ${actualBadgeClass}">${actualLabel}</span>
                        <span class="text-xs text-gray-600 font-medium">${actualDateStr}</span>
                    </div>`;
                }

                let matrixHtml = '<div class="pt-3"><div class="flex space-x-1.5 overflow-x-auto pb-1">';
                if (monthCols.length > 0) {
                    monthCols.forEach(m => {
                        const pVal = planItem ? String(planItem[m.index] || '').trim() : '';
                        const pActive = pVal !== '' && pVal !== '0';
                        const pCellBg = pActive ? 'bg-sky-200 border border-sky-400 text-sky-900' : 'bg-gray-200';

                        const aVal = actualItem ? String(actualItem[m.index] || '').trim() : '';
                        const aActive = aVal !== '' && aVal !== '0';
                        let aCellBg = 'bg-gray-200';
                        if (aActive) {
                            if (isDelayed) aCellBg = 'bg-rose-500 text-white';
                            else if (isCompleted) aCellBg = 'bg-purple-600 text-white';
                            else aCellBg = 'bg-emerald-500 text-white';
                        }

                        matrixHtml += `<div class="flex flex-col items-center flex-1 min-w-[55px] gap-1">
                            <span class="text-[11px] text-gray-600 font-bold">${m.name}</span>
                            <div class="w-full h-6 rounded ${pCellBg} flex items-center justify-center text-[11px] font-bold shadow-sm">${pActive ? 'V' : ''}</div>
                            <div class="w-full h-6 rounded ${aCellBg} flex items-center justify-center text-[11px] font-bold shadow-sm">${aActive ? 'V' : ''}</div>
                        </div>`;
                    });
                }
                matrixHtml += '</div></div>';
                contentHtml += matrixHtml + '</div>';
                div.innerHTML = headerInfo + contentHtml;
                container.appendChild(div);
            });
        }

        function exportGanttPNG() {
            const element = document.getElementById('gantt-export-area');
            const exportBtn = document.getElementById('export-btn');
            exportBtn.style.display = 'none';
            html2canvas(element, { scale: 2, useCORS: true }).then(canvas => {
                exportBtn.style.display = 'inline-block';
                const link = document.createElement('a');
                link.download = `${appData.sheets[currentSheetIndex].name}-甘特圖預覽.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function exportExcel() {
            const wb = XLSX.utils.book_new();
            appData.sheets.forEach(sheet => {
                const wsData = [sheet.columns, ...sheet.rows];
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                XLSX.utils.book_append_sheet(wb, ws, sheet.name);
            });
            XLSX.writeFile(wb, "機台擴張甘特圖資料.xlsx");
        }

        function importExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const workbook = XLSX.read(e.target.result, { type: 'binary', cellDates: true });
                const newSheets = [];
                workbook.SheetNames.forEach(sheetName => {
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "" });
                    if (json && json.length > 0) {
                        let hIdx = json.findIndex(row => row.some(cell => cell !== ""));
                        if (hIdx === -1) return;
                        const columns = json[hIdx].map(c => String(c).trim()).filter(c => c !== "");
                        const rows = json.slice(hIdx + 1).filter(row => row.some(c => c !== "")).map(row => columns.map((_, i) => row[i] !== undefined ? String(row[i]) : ""));
                        newSheets.push({ name: sheetName, columns, rows: rows.length > 0 ? rows : [new Array(columns.length).fill("")] });
                    }
                });
                if (newSheets.length > 0) {
                    appData.sheets = newSheets;
                    currentSheetIndex = 0;
                    saveToCloud();
                    renderApp();
                    alert("🎉 雲端匯入與同步成功！");
                }
            };
            reader.readAsBinaryString(file);
        }
    </script>
