<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Expansion Gantt Chart - Enterprise Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Firebase SDK (Compat 版本) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #1e40af;
            --primary-light: #3b82f6;
            --primary-dark: #1e3a8a;
            --accent: #0891b2;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --neutral-50: #f9fafb;
            --neutral-100: #f3f4f6;
            --neutral-200: #e5e7eb;
            --neutral-700: #374151;
            --neutral-900: #111827;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f5f5;
            font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .progress-section {
            background: white;
            padding: 40px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .section-date {
            font-size: 14px;
            color: #999;
            margin-bottom: 30px;
        }

        .progress-row {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            gap: 20px;
        }

        .progress-label {
            width: 150px;
            flex-shrink: 0;
        }

        .progress-label-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .progress-label-date {
            font-size: 12px;
            color: #999;
        }

        .progress-bar-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress-bar {
            flex: 1;
            height: 28px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 12px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            border-radius: 4px;
        }

        .progress-bar-fill.plan {
            background: linear-gradient(90deg, #0891b2 0%, #06b6d4 100%);
        }

        .progress-bar-fill.actual {
            background: linear-gradient(90deg, #059669 0%, #10b981 100%);
        }

        .progress-percentage {
            width: 120px;
            text-align: right;
            flex-shrink: 0;
        }

        .percentage-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 50px;
            border: 3px solid #ef4444;
            border-radius: 50%;
            font-size: 18px;
            font-weight: 700;
            color: #ef4444;
            background: white;
        }

        .toggle-options {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .toggle-btn {
            padding: 6px 14px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #f3f4f6;
            color: #666;
            transition: all 0.3s;
        }

        .toggle-btn:hover {
            background: #e5e7eb;
        }

        .toggle-btn.active {
            background: #059669;
            color: white;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .progress-section {
                box-shadow: none;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 計畫進度 Section -->
        <div class="progress-section">
            <div class="section-title">計畫進度</div>
            <div class="section-date">2026/01/01 ~ 2026/08/15</div>
            
            <div class="progress-row">
                <div class="progress-label">
                    <div class="progress-label-title">計畫進度</div>
                    <div class="progress-label-date">2026/01/01 ~ 2026/08/15</div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar">
                        <div class="progress-bar-fill plan" style="width: 67%;">67%</div>
                    </div>
                    <div class="progress-percentage">
                        <span class="toggle-options">
                            <button class="toggle-btn active">計畫進度永遠顯示100%</button>
                            <button class="toggle-btn">不須顯示</button>
                        </span>
                    </div>
                    <div class="percentage-badge">67%</div>
                </div>
            </div>

            <div class="progress-row">
                <div class="progress-label">
                    <div class="progress-label-title">實際進度</div>
                    <div class="progress-label-date">2026/03/01 ~ (施行中)</div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar">
                        <div class="progress-bar-fill actual" style="width: 50%;">50%</div>
                    </div>
                    <div class="progress-percentage">
                        <span class="toggle-options">
                            <button class="toggle-btn">不須顯示</button>
                        </span>
                    </div>
                    <div class="percentage-badge">50%</div>
                </div>
            </div>
        </div>

        <!-- 實際進度 Section -->
        <div class="progress-section">
            <div class="section-title">實際進度</div>
            <div class="section-date">2026/03/01 ~ (施行中)</div>
            
            <div class="progress-row">
                <div class="progress-label">
                    <div class="progress-label-title">實際進度</div>
                    <div class="progress-label-date">2026/03/01 ~ (施行中)</div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar">
                        <div class="progress-bar-fill actual" style="width: 50%;">50%</div>
                    </div>
                    <div class="progress-percentage">
                        <span class="toggle-options">
                            <button class="toggle-btn">不須顯示</button>
                        </span>
                    </div>
                    <div class="percentage-badge">50%</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 切換按鈕的交互邏輯
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // 移除同一個進度列中的其他按鈕的 active 狀態
                const container = this.closest('.progress-bar-container');
                if (container) {
                    container.querySelectorAll('.toggle-btn').forEach(b => {
                        b.classList.remove('active');
                    });
                }
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
