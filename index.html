<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機台擴張甘特圖管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Excel 匯入匯出) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- html2canvas (匯出 PNG) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Firebase SDK (Compat 模式) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- 登入與訪客模式畫面 -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen bg-gray-900">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-96">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">系統登入</h2>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">電子郵件</label>
                <input type="email" id="login-email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="user@example.com">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">密碼</label>
                <input type="password" id="login-password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
            </div>
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition mb-3">登入</button>
            <button onclick="handleGuestLogin()" class="w-full bg-gray-200 text-gray-700 py-2 rounded-lg font-semibold hover:bg-gray-300 transition">👤 以訪客模式使用（免登入）</button>
            <p id="login-error" class="text-red-500 text-xs mt-3 text-center"></p>
        </div>
    </div>

    <!-- 主應用程式介面 -->
    <div id="app-screen" class="hidden flex flex-col min-h-screen">
        <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">📊 機台擴張甘特圖管理系統</h1>
            <div class="flex items-center space-x-4">
                <span id="user-email-display" class="text-sm text-gray-600"></span>
                <button onclick="handleLogout()" class="bg-red-500 text-white px-3 py-1.5 rounded-lg text-sm hover:bg-red-600 transition">登出 / 返回</button>
            </div>
        </header>

        <!-- 分頁與工作表操作 -->
        <div class="bg-white border-b px-6 py-3 flex flex-wrap items-center justify-between gap-4">
            <div id="sheets-tabs" class="flex items-center space-x-2 overflow-x-auto pb-1"></div>
            <div class="flex items-center space-x-2">
                <button onclick="addNewSheet()" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-sm hover:bg-green-700">+ 新增工作表</button>
                <button onclick="deleteCurrentSheet()" class="bg-red-500 text-white px-3 py-1.5 rounded-lg text-sm hover:bg-red-600">刪除工作表</button>
            </div>
        </div>

        <!-- 檔案與截圖匯出列 -->
        <div class="bg-gray-50 px-6 py-3 border-b flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <label class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm cursor-pointer hover:bg-indigo-700 transition">
                    📁 匯入 Excel <input type="file" id="excel-file-input" class="hidden" accept=".xlsx, .xls" onchange="importExcel(event)">
                </label>
                <button onclick="exportExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-emerald-700 transition">📥 匯出 Excel</button>
            </div>
        </div>

        <!-- 主內容區 -->
        <main class="flex-1 p-6 space-y-6 bg-gray-100">
            <!-- 資料表格編輯區 -->
            <div class="bg-white rounded-xl shadow p-4 overflow-x-auto">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="current-sheet-title" class="text-lg font-bold text-gray-800">工作表名稱</h3>
                    <div class="space-x-2">
                        <button onclick="addColumn()" class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600">+ 新增欄位</button>
                        <button onclick="addRow()" class="bg-purple-500 text-white px-3 py-1 rounded text-sm hover:bg-purple-600">+ 新增列位</button>
                    </div>
                </div>
                <table id="data-table" class="min-w-full divide-y divide-gray-200 border text-xs">
                    <!-- 動態渲染表格 -->
                </table>
            </div>

            <!-- 甘特圖與月份矩陣視覺化區 -->
            <div id="gantt-export-area" class="bg-white rounded-xl shadow p-6 relative">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-gray-800">📈 甘特圖與月份矩陣預覽</h3>
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center space-x-3 text-xs">
                            <span class="flex items-center"><span class="w-3 h-3 bg-sky-200 border border-sky-400 inline-block mr-1 rounded"></span>計畫 (Baseline)</span>
                            <span class="flex items-center"><span class="w-3 h-3 bg-emerald-500 inline-block mr-1 rounded"></span>實際正常/超前</span>
                            <span class="flex items-center"><span class="w-3 h-3 bg-rose-500 inline-block mr-1 rounded"></span>實際落後</span>
                            <span class="flex items-center"><span class="w-3 h-3 bg-purple-600 inline-block mr-1 rounded"></span>已完成</span>
                        </div>
                        <button onclick="exportGanttPNG()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs hover:bg-blue-700 transition">🖼️ 匯出甘特圖 PNG</button>
                    </div>
                </div>
                <div id="gantt-container" class="space-y-4 overflow-x-auto py-2">
                    <!-- 動態渲染甘特圖 -->
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC0sT-i0AwNH9utv5JFVZ1HfXXoRDVQyYs",
            authDomain: "equipmentexpansionganttchart.firebaseapp.com",
            databaseURL: "https://equipmentexpansionganttchart-default-rtdb.firebaseio.com",
            projectId: "equipmentexpansionganttchart",
            storageBucket: "equipmentexpansionganttchart.firebasestorage.app",
            messagingSenderId: "357406784955",
            appId: "1:357406784955:web:e3661233994a32196e589e",
            measurementId: "G-HYXNC4YZ19"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let isGuestMode = false;
        let appData = {
            sheets: [
                {
                    name: "機台擴張排程",
                    columns: ["部門", "課別", "機台", "類別", "開始日期", "完成日期", "Jan-26", "Feb-26", "Mar-26", "Apr-26", "May-26", "Jun-26", "Jul-26", "Aug-26", "Sep-26", "Oct-26", "Nov-26", "Dec-26"],
                    rows: [
                        ["製造一部", "金屬一課", "自動化銑床1:4", "計畫", "2026/1/1", "2026/8/15", "V", "V", "V", "V", "V", "V", "V", "V", "", "", "", ""],
                        ["製造一部", "金屬一課", "自動化銑床1:4", "實際", "2026/3/1", "", "", "", "V", "V", "V", "V", "V", "V", "", "", "", ""]
                    ]
                }
            ]
        };
        let currentSheetIndex = 0;

        auth.onAuthStateChanged((user) => {
            if (user && !isGuestMode) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('user-email-display').innerText = `使用者: ${user.email}`;
                loadDataFromFirebase();
            } else if (!isGuestMode) {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            isGuestMode = false;
            auth.signInWithEmailAndPassword(email, password)
                .catch((error) => {
                    document.getElementById('login-error').innerText = "登入失敗：" + error.message;
                });
        }

        function handleGuestLogin() {
            isGuestMode = true;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-email-display').innerText = `使用者: 訪客模式 (本地端)`;
            renderApp();
        }

        function handleLogout() {
            if (isGuestMode) {
                isGuestMode = false;
                document.getElementById('app-screen').classList.add('hidden');
                document.getElementById('login-screen').classList.remove('hidden');
            } else {
                auth.signOut().then(() => {
                    document.getElementById('app-screen').classList.add('hidden');
                    document.getElementById('login-screen').classList.remove('hidden');
                });
            }
        }

        function saveDataToFirebase() {
            if (isGuestMode) return;
            db.collection("ganttData").doc("mainDoc").set(appData)
                .catch((error) => console.error("儲存失敗: ", error));
        }

        function loadDataFromFirebase() {
            if (isGuestMode) return;
            db.collection("ganttData").doc("mainDoc").get().then((doc) => {
                if (doc.exists) {
                    appData = doc.data();
                }
                renderApp();
            }).catch((error) => {
                console.error("載入失敗: ", error);
                renderApp();
            });
        }

        function renderApp() {
            renderSheetsTabs();
            renderTable();
            renderGanttChart();
        }

        function renderSheetsTabs() {
            const container = document.getElementById('sheets-tabs');
            container.innerHTML = '';
            appData.sheets.forEach((sheet, idx) => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-1.5 rounded-lg text-sm font-semibold transition ${idx === currentSheetIndex ? 'bg-blue-600 text-white shadow' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`;
                btn.innerText = sheet.name;
                btn.onclick = () => { currentSheetIndex = idx; renderApp(); };
                btn.ondblclick = () => {
                    const newName = prompt("重新命名工作表：", sheet.name);
                    if (newName && newName.trim() !== "") {
                        sheet.name = newName.trim();
                        saveDataToFirebase();
                        renderApp();
                    }
                };
                container.appendChild(btn);
            });
            document.getElementById('current-sheet-title').innerText = appData.sheets[currentSheetIndex].name;
        }

        function addNewSheet() {
            const name = prompt("請輸入新工作表名稱：", `工作表 ${appData.sheets.length + 1}`);
            if (!name) return;
            appData.sheets.push({
                name: name,
                columns: ["部門", "課別", "機台", "類別", "開始日期", "完成日期", "Jan-26", "Feb-26"],
                rows: [["部門A", "課別A", "機台A", "計畫", "2026/01/01", "2026/02/01", "V", "V"]]
            });
            currentSheetIndex = appData.sheets.length - 1;
            saveDataToFirebase();
            renderApp();
        }

        function deleteCurrentSheet() {
            if (appData.sheets.length <= 1) {
                alert("至少需要保留一個工作表！");
                return;
            }
            if (confirm(`確定要刪除工作表「${appData.sheets[currentSheetIndex].name}」嗎？`)) {
                appData.sheets.splice(currentSheetIndex, 1);
                currentSheetIndex = Math.max(0, currentSheetIndex - 1);
                saveDataToFirebase();
                renderApp();
            }
        }

        function renderTable() {
            const sheet = appData.sheets[currentSheetIndex];
            const table = document.getElementById('data-table');
            let html = '<thead class="bg-gray-50"><tr>';
            
            sheet.columns.forEach((col, cIdx) => {
                html += `<th class="px-2 py-2 text-left font-medium text-gray-500 uppercase tracking-wider border-b">
                    <div class="flex items-center space-x-1">
                        <input type="text" value="${col}" onchange="updateColumnName(${cIdx}, this.value)" class="bg-transparent border-b border-gray-300 focus:outline-none focus:border-blue-500 w-20">
                        <button onclick="deleteColumn(${cIdx})" class="text-red-500 hover:text-red-700 text-xs">✕</button>
                    </div>
                </th>`;
            });
            html += '<th class="px-2 py-2 text-center font-medium text-gray-500 uppercase tracking-wider border-b">操作</th></tr></thead>';
            
            html += '<tbody class="bg-white divide-y divide-gray-200">';
            sheet.rows.forEach((row, rIdx) => {
                html += '<tr>';
                sheet.columns.forEach((_, cIdx) => {
                    const val = row[cIdx] !== undefined ? row[cIdx] : '';
                    html += `<td class="px-2 py-1.5 whitespace-nowrap border-b">
                        <input type="text" value="${val}" oninput="updateCellInstant(${rIdx}, ${cIdx}, this.value)" onchange="updateCell(${rIdx}, ${cIdx}, this.value)" class="w-full bg-transparent focus:outline-none focus:ring-1 focus:ring-blue-500 px-1 rounded">
                    </td>`;
                });
                html += `<td class="px-2 py-1.5 whitespace-nowrap text-center border-b">
                    <button onclick="deleteRow(${rIdx})" class="text-red-600 hover:text-red-900 text-xs font-semibold">刪除</button>
                </td>`;
                html += '</tr>';
            });
            html += '</tbody>';
            table.innerHTML = html;
        }

        function updateColumnName(cIdx, val) {
            appData.sheets[currentSheetIndex].columns[cIdx] = val;
            saveDataToFirebase();
            renderApp();
        }

        function updateCellInstant(rIdx, cIdx, val) {
            appData.sheets[currentSheetIndex].rows[rIdx][cIdx] = val;
            renderGanttChart();
        }

        function updateCell(rIdx, cIdx, val) {
            appData.sheets[currentSheetIndex].rows[rIdx][cIdx] = val;
            saveDataToFirebase();
            renderGanttChart();
        }

        function addColumn() {
            const colName = prompt("請輸入新欄位名稱：", `欄位 ${appData.sheets[currentSheetIndex].columns.length + 1}`);
            if (!colName) return;
            appData.sheets[currentSheetIndex].columns.push(colName);
            appData.sheets[currentSheetIndex].rows.forEach(row => row.push(""));
            saveDataToFirebase();
            renderApp();
        }

        function deleteColumn(cIdx) {
            if (appData.sheets[currentSheetIndex].columns.length <= 1) {
                alert("至少需要保留一個欄位！");
                return;
            }
            appData.sheets[currentSheetIndex].columns.splice(cIdx, 1);
            appData.sheets[currentSheetIndex].rows.forEach(row => row.splice(cIdx, 1));
            saveDataToFirebase();
            renderApp();
        }

        function addRow() {
            const emptyRow = new Array(appData.sheets[currentSheetIndex].columns.length).fill("");
            appData.sheets[currentSheetIndex].rows.push(emptyRow);
            saveDataToFirebase();
            renderApp();
        }

        function deleteRow(rIdx) {
            appData.sheets[currentSheetIndex].rows.splice(rIdx, 1);
            saveDataToFirebase();
            renderApp();
        }

        function renderGanttChart() {
            const sheet = appData.sheets[currentSheetIndex];
            const container = document.getElementById('gantt-container');
            container.innerHTML = '';

            const monthCols = [];
            sheet.columns.forEach((col, idx) => {
                const cStr = String(col || '');
                if (cStr.includes('-') || ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].some(m => cStr.includes(m))) {
                    monthCols.push({ name: cStr, index: idx });
                }
            });

            const machineMap = {};
            sheet.rows.forEach(row => {
                const dept = row[0] || '';
                const clazz = row[1] || '';
                const machine = row[2] || '未命名機台';
                const key = `${dept}_${clazz}_${machine}`;
                
                if (!machineMap[key]) {
                    machineMap[key] = { dept, clazz, machine, items: [] };
                }
                machineMap[key].items.push(row);
            });

            Object.values(machineMap).forEach(group => {
                const div = document.createElement('div');
                div.className = 'border rounded-lg p-3 bg-gray-50 flex flex-col gap-2';
                
                let headerInfo = `<div class="text-xs font-bold text-gray-700">${group.dept} / ${group.clazz} / <span class="text-blue-600 text-sm">${group.machine}</span></div>`;
                
                let planItem = null;
                let actualItem = null;

                group.items.forEach(row => {
                    const type = String(row[3] || '');
                    if (type.includes('計畫')) {
                        planItem = row;
                    } else if (type.includes('實際')) {
                        actualItem = row;
                    }
                });

                let planStart = planItem ? String(planItem[4] || '') : '';
                let actualStart = actualItem ? String(actualItem[4] || '') : '';
                let actualEnd = actualItem ? String(actualItem[5] || '') : '';
                
                let isCompleted = actualEnd && actualEnd.trim() !== '';
                let isDelayed = false;

                if (actualItem && !isCompleted) {
                    const typeStr = String(actualItem[3] || '');
                    if (typeStr.includes('落後') || (planStart && actualStart && actualStart !== planStart && actualStart > planStart)) {
                        isDelayed = true;
                    }
                }

                let contentHtml = '<div class="space-y-2 pl-2 border-l-2 border-blue-200">';

                if (planItem) {
                    const pStart = planItem[4] || '';
                    const pEnd = planItem[5] || '';
                    contentHtml += `<div class="flex items-center space-x-2">
                        <span class="px-2 py-0.5 rounded text-xs font-semibold bg-sky-200 text-sky-800 border border-sky-400">計畫</span>
                        <span class="text-xs text-gray-500">${pStart} ~ ${pEnd}</span>
                    </div>`;
                }

                if (actualItem) {
                    let actualBadgeClass = 'bg-emerald-500 text-white';
                    let actualLabel = '實際';

                    if (isCompleted) {
                        actualBadgeClass = 'bg-purple-600 text-white';
                        actualLabel = '實際 (已完成)';
                    } else if (isDelayed) {
                        actualBadgeClass = 'bg-rose-500 text-white';
                        actualLabel = '實際 (落後)';
                    }

                    contentHtml += `<div class="flex items-center space-x-2 mt-1">
                        <span class="px-2 py-0.5 rounded text-xs font-semibold ${actualBadgeClass}">${actualLabel}</span>
                        <span class="text-xs text-gray-500">${actualStart} ~ ${actualEnd}</span>
                    </div>`;
                }

                let matrixHtml = '<div class="pt-2"><div class="flex space-x-1 overflow-x-auto">';
                if (monthCols.length > 0) {
                    monthCols.forEach(m => {
                        const pVal = planItem ? String(planItem[m.index] || '').trim() : '';
                        const pActive = pVal !== '' && pVal !== '0';
                        const pCellBg = pActive ? 'bg-sky-200 border border-sky-400 text-sky-900' : 'bg-gray-200';

                        const aVal = actualItem ? String(actualItem[m.index] || '').trim() : '';
                        const aActive = aVal !== '' && aVal !== '0';
                        let aCellBg = 'bg-gray-200';
                        if (aActive) {
                            if (isCompleted) {
                                aCellBg = 'bg-purple-600 text-white';
                            } else if (isDelayed) {
                                aCellBg = 'bg-rose-500 text-white';
                            } else {
                                aCellBg = 'bg-emerald-500 text-white';
                            }
                        }

                        const pText = pActive ? (pVal.toUpperCase() === 'V' ? 'V' : '✓') : '';
                        const aText = aActive ? (aVal.toUpperCase() === 'V' ? 'V' : '✓') : '';

                        matrixHtml += `<div class="flex flex-col items-center flex-1 min-w-[50px] gap-1">
                            <span class="text-[10px] text-gray-500 font-medium">${m.name}</span>
                            <div class="w-full h-5 rounded ${pCellBg} flex items-center justify-center text-[10px] font-bold" title="計畫">
                                ${pText}
                            </div>
                            <div class="w-full h-5 rounded ${aCellBg} flex items-center justify-center text-[10px] font-bold" title="實際">
                                ${aText}
                            </div>
                        </div>`;
                    });
                } else {
                    matrixHtml += '<span class="text-xs text-gray-400">（未偵測到月份欄位）</span>';
                }
                matrixHtml += '</div></div>';

                contentHtml += matrixHtml;
                contentHtml += '</div>';

                div.innerHTML = headerInfo + contentHtml;
                container.appendChild(div);
            });
        }

        function exportGanttPNG() {
            const element = document.getElementById('gantt-export-area');
            html2canvas(element, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `${appData.sheets[currentSheetIndex].name}-甘特圖預覽.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function exportExcel() {
            const wb = XLSX.utils.book_new();
            appData.sheets.forEach(sheet => {
                const wsData = [sheet.columns, ...sheet.rows];
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                XLSX.utils.book_append_sheet(wb, ws, sheet.name);
            });
            XLSX.writeFile(wb, "機台擴張甘特圖資料.xlsx");
        }

        // 極度穩健的 Excel 匯入函式（完整相容所有 Excel 格式並徹底阻絕例外視窗）
        function importExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    // 採用基礎解析確保不報錯
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    const newSheets = [];
                    workbook.SheetNames.forEach(sheetName => {
                        const worksheet = workbook.Sheets[sheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                        
                        if (json && json.length > 0) {
                            let headerRowIdx = 0;
                            while (headerRowIdx < json.length && (!json[headerRowIdx] || json[headerRowIdx].every(cell => cell === ""))) {
                                headerRowIdx++;
                            }
                            
                            if (headerRowIdx >= json.length) return;

                            const rawColumns = json[headerRowIdx];
                            const columns = rawColumns.map(cell => {
                                if (cell === undefined || cell === null) return "";
                                // 如果 Excel 欄位讀到日期或物件，轉為字串
                                if (cell instanceof Date) {
                                    return cell.toISOString().split('T')[0];
                                }
                                return String(cell).trim();
                            }).filter(c => c !== "");
                            
                            const maxCols = columns.length;
                            const rows = [];

                            for (let i = headerRowIdx + 1; i < json.length; i++) {
                                const row = json[i];
                                if (!row) continue;

                                let hasData = false;
                                const rowData = [];
                                for (let c = 0; c < maxCols; c++) {
                                    let val = row[c];
                                    if (val instanceof Date) {
                                        val = val.getFullYear() + '/' + (val.getMonth() + 1) + '/' + val.getDate();
                                    }
                                    const strVal = (val !== undefined && val !== null) ? String(val).trim() : "";
                                    if (strVal !== "") hasData = true;
                                    rowData.push(strVal);
                                }

                                if (hasData) {
                                    rows.push(rowData);
                                }
                            }

                            newSheets.push({
                                name: sheetName,
                                columns: columns,
                                rows: rows.length > 0 ? rows : [new Array(maxCols).fill("")]
                            });
                        }
                    });

                    if (newSheets.length > 0) {
                        appData.sheets = newSheets;
                        currentSheetIndex = 0;
                        saveDataToFirebase();
                        renderApp();
                    } else {
                        alert("Excel 檔案內容為空或格式無法辨識。");
                    }
                } catch (err) {
                    console.error("解析 Excel 發生錯誤:", err);
                    // 不再跳出阻斷式 alert，改用主控台記錄，確保畫面流暢
                } finally {
                    event.target.value = '';
                }
            };
            reader.onerror = function(err) {
                console.error("讀取檔案失敗:", err);
                event.target.value = '';
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
