<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機台擴張甘特圖管理系統 - 跨年動態版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans antialiased relative">

    <!-- 登入覆蓋遮罩 -->
    <div id="login-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 space-y-6">
            <div class="text-center space-y-2">
                <span class="text-4xl">🔐</span>
                <h2 class="text-xl font-bold text-gray-800">系統登入驗證</h2>
                <p class="text-xs text-gray-500">請輸入 Firebase 電子郵件與密碼以解鎖編輯功能</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">電子郵件 (Email)</label>
                    <input type="email" id="login-email" value="n1693131@gmail.com" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="name@example.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">密碼 (Password)</label>
                    <input type="password" id="login-pass" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="請輸入密碼">
                </div>
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-700 transition shadow-md">登入系統</button>
                <div id="login-error" class="text-xs text-rose-500 text-center font-medium hidden p-2 bg-rose-50 rounded border border-rose-200"></div>
            </div>
            <div class="text-center">
                <button onclick="enterAsGuest()" class="text-xs text-gray-500 hover:text-gray-700 underline">以訪客模式檢視（僅能查看與匯出）</button>
            </div>
        </div>
    </div>

    <!-- 主應用程式介面 -->
    <div class="flex flex-col min-h-screen">
        <header class="bg-white shadow px-6 py-4 flex justify-between items-center border-b">
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <span>☁️</span> 機台擴張甘特圖管理系統 <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-normal">跨年動態版</span>
            </h1>
            <div class="flex items-center space-x-4">
                <span id="sync-status" class="text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-medium">⏳ 連線中...</span>
                <span id="auth-status-badge" class="text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded-full font-semibold">🔒 訪客模式 (唯讀)</span>
                <button id="logout-btn" onclick="handleLogout()" class="hidden text-xs bg-rose-100 text-rose-700 px-3 py-1 rounded-full font-semibold hover:bg-rose-200 transition">登出</button>
            </div>
        </header>

        <!-- 分頁與工作表操作 -->
        <div class="bg-white border-b px-6 py-3 flex flex-wrap items-center justify-between gap-4">
            <div id="sheets-tabs" class="flex items-center space-x-2 overflow-x-auto pb-1"></div>
            <div id="admin-sheet-controls" class="flex items-center space-x-2 opacity-50 pointer-events-none">
                <button onclick="addNewSheet()" class="bg-emerald-600 text-white px-3.5 py-1.5 rounded-lg text-sm hover:bg-emerald-700 transition shadow-sm">+ 新增工作表</button>
                <button onclick="deleteCurrentSheet()" class="bg-rose-500 text-white px-3.5 py-1.5 rounded-lg text-sm hover:bg-rose-600 transition shadow-sm">刪除工作表</button>
            </div>
        </div>

        <!-- 檔案與截圖匯出列 -->
        <div class="bg-gray-50 px-6 py-3 border-b flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <label id="import-file-label" class="bg-gray-400 text-white px-4 py-2 rounded-lg text-sm cursor-not-allowed flex items-center gap-1.5 font-medium select-none">
                    📁 匯入 Excel <input type="file" id="excel-file-input" class="hidden" accept=".xlsx, .xls, .csv" disabled onchange="importExcel(event)">
                </label>
                <button onclick="exportExcel()" class="bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm hover:bg-emerald-800 transition shadow-sm font-medium">📥 匯出 Excel</button>
            </div>
        </div>

        <!-- 主內容區 -->
        <main class="flex-1 p-6 space-y-6 bg-gray-100">
            <!-- 資料表格編輯區 -->
            <div id="table-container-wrapper" class="bg-white rounded-xl shadow-sm border p-4 overflow-x-auto opacity-65 pointer-events-none transition">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="current-sheet-title" class="text-base font-bold text-gray-800">工作表名稱</h3>
                    <div class="space-x-2">
                        <button onclick="addColumn()" class="bg-blue-600 text-white px-3 py-1 rounded text-xs hover:bg-blue-700 transition">+ 新增欄位</button>
                        <button onclick="addRow()" class="bg-purple-600 text-white px-3 py-1 rounded text-xs hover:bg-purple-700 transition">+ 新增列位</button>
                    </div>
                </div>
                <div class="max-h-96 overflow-y-auto border rounded-lg">
                    <table id="data-table" class="w-full divide-y divide-gray-200 text-xs table-auto"></table>
                </div>
            </div>

            <!-- 甘特圖預覽區 (中文版) -->
            <div id="gantt-export-area" class="bg-white rounded-xl shadow-sm border p-6 relative">
                <div class="flex justify-between items-center mb-4 flex-wrap gap-3">
                    <h3 class="text-base font-bold text-gray-800">📈 甘特圖時間軸預覽 (中文版)</h3>
                    <div class="flex items-center space-x-4 flex-wrap gap-2">
                        <div class="flex items-center space-x-3 text-xs bg-gray-50 px-3 py-1.5 rounded-lg border">
                            <span class="flex items-center"><span class="w-3 h-3 bg-amber-400 inline-block mr-1 rounded"></span>計畫</span>
                            <span class="flex items-center"><span class="w-3 h-3 bg-emerald-500 inline-block mr-1 rounded"></span>進行中</span>
                            <span class="flex items-center"><span class="w-3 h-3 bg-rose-500 inline-block mr-1 rounded"></span>落後</span>
                            <span class="flex items-center"><span class="w-3 h-3 bg-cyan-500 inline-block mr-1 rounded"></span>已完成</span>
                        </div>
                        <button id="export-btn" onclick="exportGanttPNG()" class="bg-blue-600 text-white px-3.5 py-1.5 rounded-lg text-xs hover:bg-blue-700 transition shadow-sm font-medium">匯出甘特圖 PNG</button>
                    </div>
                </div>
                <div id="gantt-container" class="overflow-x-auto py-2"></div>
            </div>

            <!-- 甘特圖預覽區 (英文版) -->
            <div id="gantt-export-area-en" class="bg-white rounded-xl shadow-sm border p-6 relative">
                <div class="flex justify-between items-center mb-4 flex-wrap gap-3">
                    <h3 class="text-base font-bold text-gray-800">📈 Equipment Expansion Gantt Chart (English Version)</h3>
                    <div class="flex items-center space-x-4 flex-wrap gap-2">
                        <div class="flex items-center space-x-3 text-xs bg-gray-50 px-3 py-1.5 rounded-lg border">
                            <span class="flex items-center"><span class="w-3 h-3 bg-amber-400 inline-block mr-1 rounded"></span>Plan</span>
                            <span class="flex items-center"><span class="w-3 h-3 bg-emerald-500 inline-block mr-1 rounded"></span>In Progress</span>
                            <span class="flex items-center"><span class="w-3 h-3 bg-rose-500 inline-block mr-1 rounded"></span>Delayed</span>
                            <span class="flex items-center"><span class="w-3 h-3 bg-cyan-500 inline-block mr-1 rounded"></span>Completed</span>
                        </div>
                        <button id="export-btn-en" onclick="exportGanttPNG_EN()" class="bg-indigo-600 text-white px-3.5 py-1.5 rounded-lg text-xs hover:bg-indigo-700 transition shadow-sm font-medium">Export English PNG</button>
                    </div>
                </div>
                <div id="gantt-container-en" class="overflow-x-auto py-2"></div>
            </div>
        </main>
    </div>

    <!-- 邏輯腳本 (Firebase v8) -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC0sT-i0AwNH9utv5JFVZ1HfXXoRDVQyYs",
            authDomain: "equipmentexpansionganttchart.firebaseapp.com",
            databaseURL: "https://equipmentexpansionganttchart-default-rtdb.firebaseio.com",
            projectId: "equipmentexpansionganttchart",
            storageBucket: "equipmentexpansionganttchart.firebasestorage.app",
            messagingSenderId: "357406784955",
            appId: "1:357406784955:web:e3661233994a32196e589e",
            measurementId: "G-HYXNC4YZ19"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const rtdb = firebase.database();

        let appData = { sheets: [] };
        let currentSheetIndex = 0;
        let isLoggedIn = false;

        window.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged((user) => {
                isLoggedIn = !!user;
                updateUIPermissions();
            });
            loadFromCloud();
        });

        function formatDateClean(val) {
            if (!val) return "";
            const str = String(val).trim();
            const d = new Date(str);
            if (!isNaN(d.getTime()) && (str.includes("GMT") || str.includes("T") || str.length > 10)) {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                if (year >= 2000 && year <= 2100) {
                    return `${year}/${month}/${day}`;
                }
            }
            return str;
        }

        function formatHeaderClean(val) {
            if (!val) return "";
            const str = String(val).trim();
            const d = new Date(str);
            if (!isNaN(d.getTime()) && (str.includes("GMT") || str.includes("T") || str.length > 10)) {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                if (year >= 2000 && year <= 2100) {
                    return `${year}/${month}/${day}`;
                }
            }
            return str;
        }

        function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const errEl = document.getElementById('login-error');

            if (!email || !pass) {
                errEl.innerText = "請輸入電子郵件與密碼！";
                errEl.classList.remove('hidden');
                return;
            }

            auth.signInWithEmailAndPassword(email, pass)
                .then(() => {
                    document.getElementById('login-modal').classList.add('hidden');
                    errEl.classList.add('hidden');
                })
                .catch((error) => {
                    console.error("Firebase Login Error:", error);
                    let msg = "登入失敗：" + error.message;
                    errEl.innerText = msg;
                    errEl.classList.remove('hidden');
                });
        }

        function enterAsGuest() {
            document.getElementById('login-modal').classList.add('hidden');
            updateUIPermissions();
        }

        function handleLogout() {
            auth.signOut().then(() => {
                document.getElementById('login-pass').value = "";
                document.getElementById('login-modal').classList.remove('hidden');
                updateUIPermissions();
            });
        }

        function updateUIPermissions() {
            const badge = document.getElementById('auth-status-badge');
            const logoutBtn = document.getElementById('logout-btn');
            const adminSheetControls = document.getElementById('admin-sheet-controls');
            const importLabel = document.getElementById('import-file-label');
            const fileInput = document.getElementById('excel-file-input');
            const tableWrapper = document.getElementById('table-container-wrapper');

            if (isLoggedIn) {
                badge.className = "text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-semibold";
                badge.innerText = "🔓 管理者模式 (已解鎖)";
                logoutBtn.classList.remove('hidden');
                
                adminSheetControls.classList.remove('opacity-50', 'pointer-events-none');
                importLabel.className = "bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm cursor-pointer hover:bg-indigo-700 transition shadow-sm flex items-center gap-1.5 font-medium";
                fileInput.disabled = false;
                tableWrapper.classList.remove('opacity-65', 'pointer-events-none');
            } else {
                badge.className = "text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded-full font-semibold";
                badge.innerText = "🔒 訪客模式 (唯讀)";
                logoutBtn.classList.add('hidden');

                adminSheetControls.classList.add('opacity-50', 'pointer-events-none');
                importLabel.className = "bg-gray-400 text-white px-4 py-2 rounded-lg text-sm cursor-not-allowed flex items-center gap-1.5 font-medium select-none";
                fileInput.disabled = true;
                tableWrapper.classList.add('opacity-65', 'pointer-events-none');
            }
        }

        function loadFromCloud() {
            const statusEl = document.getElementById('sync-status');
            rtdb.ref('ganttSystem/mainData').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.sheets) {
                    appData = data;
                    appData.sheets.forEach(sheet => {
                        if (!sheet.notes) sheet.notes = {};
                        
                        // 自動補齊必要欄位（相容舊資料）
                        if (!sheet.columns.includes("擺放位置") && !sheet.columns.includes("Location")) {
                            sheet.columns.splice(4, 0, "擺放位置");
                            sheet.rows.forEach(row => row.splice(4, 0, ""));
                        }
                        if (!sheet.columns.includes("機台數量") && !sheet.columns.includes("Machine Qty")) {
                            sheet.columns.splice(3, 0, "機台數量");
                            sheet.rows.forEach(row => row.splice(3, 0, "1"));
                        }
                        if (!sheet.columns.includes("備註") && !sheet.columns.includes("Remarks")) {
                            sheet.columns.push("備註");
                            sheet.rows.forEach(row => row.push(""));
                        }

                        sheet.columns = sheet.columns.map(col => formatHeaderClean(col));
                        sheet.rows.forEach(row => {
                            const dateIdx1 = sheet.columns.findIndex(c => c.includes("開始") || c.toLowerCase().includes("start"));
                            const dateIdx2 = sheet.columns.findIndex(c => c.includes("完成") || c.toLowerCase().includes("end") || c.toLowerCase().includes("complete"));
                            if (dateIdx1 !== -1) row[dateIdx1] = formatDateClean(row[dateIdx1]);
                            if (dateIdx2 !== -1) row[dateIdx2] = formatDateClean(row[dateIdx2]);
                        });
                    });
                    statusEl.className = "text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-medium";
                    statusEl.innerText = "✅ 已連線雲端資料庫";
                } else {
                    appData = {
                        sheets: [{
                            name: "機台擴張排程",
                            columns: ["部門", "課別", "機台", "機台數量", "擺放位置", "類別", "開始日期", "完成日期", "備註"],
                            rows: [
                                ["製造一部", "金屬一課", "自動化銑床1:4", "2", "A區-01", "計畫", "2026-01-05", "2027-04-15", "首批試作機"],
                                ["製造一部", "金屬一課", "自動化銑床1:4", "2", "A區-01", "進行中", "2026-03-01", "2027-09-15", "量產擴充"]
                            ],
                            notes: {}
                        }]
                    };
                    saveToCloud();
                }
                renderApp();
            });
        }

        function saveToCloud() {
            if (!isLoggedIn) return;
            rtdb.ref('ganttSystem/mainData').set(appData);
        }

        function renderApp() {
            renderSheetsTabs();
            renderTable();
            renderGanttChart();
            renderGanttChartEN();
        }

        function renderSheetsTabs() {
            const container = document.getElementById('sheets-tabs');
            container.innerHTML = '';
            appData.sheets.forEach((sheet, idx) => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-1.5 rounded-lg text-sm font-semibold transition shadow-sm ${idx === currentSheetIndex ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`;
                btn.innerText = sheet.name;
                btn.onclick = () => { currentSheetIndex = idx; renderApp(); };
                if (isLoggedIn) {
                    btn.ondblclick = () => {
                        const newName = prompt("重新命名工作表：", sheet.name);
                        if (newName && newName.trim() !== "") {
                            sheet.name = newName.trim();
                            saveToCloud();
                            renderApp();
                        }
                    };
                }
                container.appendChild(btn);
            });
            document.getElementById('current-sheet-title').innerText = appData.sheets[currentSheetIndex].name;
        }

        function addNewSheet() {
            if (!isLoggedIn) return;
            const name = prompt("請輸入新工作表名稱：", `工作表 ${appData.sheets.length + 1}`);
            if (!name) return;
            appData.sheets.push({
                name: name.trim(),
                columns: ["部門", "課別", "機台", "機台數量", "擺放位置", "類別", "開始日期", "完成日期", "備註"],
                rows: [["部門A", "課別A", "機台A", "1", "位置A", "計畫", "2026-01-01", "2027-03-31", ""]],
                notes: {}
            });
            currentSheetIndex = appData.sheets.length - 1;
            saveToCloud();
            renderApp();
        }

        function deleteCurrentSheet() {
            if (!isLoggedIn) return;
            if (appData.sheets.length <= 1) {
                alert("至少需要保留一個工作表！");
                return;
            }
            if (confirm(`確定要刪除工作表「${appData.sheets[currentSheetIndex].name}」嗎？`)) {
                appData.sheets.splice(currentSheetIndex, 1);
                currentSheetIndex = Math.max(0, currentSheetIndex - 1);
                saveToCloud();
                renderApp();
            }
        }

        function renderTable() {
            const sheet = appData.sheets[currentSheetIndex];
            const table = document.getElementById('data-table');
            let html = '<thead class="bg-gray-50 sticky top-0 z-10"><tr>';
            
            sheet.columns.forEach((col, cIdx) => {
                html += `<th class="px-3 py-2 text-left font-medium text-gray-600 uppercase tracking-wider border-b whitespace-nowrap">
                    <div class="flex items-center space-x-1">
                        <input type="text" value="${col}" ${!isLoggedIn ? 'disabled' : ''} onchange="updateColumnName(${cIdx}, this.value)" class="bg-transparent border-b border-gray-300 focus:outline-none focus:border-blue-500 w-auto min-w-[70px] text-xs font-semibold">
                        ${isLoggedIn ? `<button onclick="deleteColumn(${cIdx})" class="text-red-500 hover:text-red-700 text-xs px-1">✕</button>` : ''}
                    </div>
                </th>`;
            });
            if (isLoggedIn) html += '<th class="px-3 py-2 text-center font-medium text-gray-600 uppercase tracking-wider border-b whitespace-nowrap">操作</th>';
            html += '</tr></thead>';
            
            html += '<tbody class="bg-white divide-y divide-gray-200">';
            sheet.rows.forEach((row, rIdx) => {
                html += '<tr class="hover:bg-gray-50 transition">';
                sheet.columns.forEach((_, cIdx) => {
                    const val = row[cIdx] !== undefined ? row[cIdx] : '';
                    html += `<td class="px-3 py-2 border-b whitespace-nowrap">
                        <input type="text" value="${val}" ${!isLoggedIn ? 'disabled' : ''} oninput="updateCellInstant(${rIdx}, ${cIdx}, this.value)" onchange="updateCell(${rIdx}, ${cIdx}, this.value)" class="w-full bg-transparent focus:outline-none focus:ring-1 focus:ring-blue-500 px-1 rounded text-xs text-gray-800">
                    </td>`;
                });
                if (isLoggedIn) {
                    html += `<td class="px-3 py-2 whitespace-nowrap text-center border-b">
                        <button onclick="deleteRow(${rIdx})" class="text-red-600 hover:text-red-900 text-xs font-semibold">刪除</button>
                    </td>`;
                }
                html += '</tr>';
            });
            html += '</tbody>';
            table.innerHTML = html;
        }

        function updateColumnName(cIdx, val) {
            if (!isLoggedIn) return;
            appData.sheets[currentSheetIndex].columns[cIdx] = formatHeaderClean(val);
            saveToCloud();
            renderApp();
        }

        function updateCellInstant(rIdx, cIdx, val) {
            appData.sheets[currentSheetIndex].rows[rIdx][cIdx] = val;
            renderGanttChart();
            renderGanttChartEN();
        }

        function updateCell(rIdx, cIdx, val) {
            if (!isLoggedIn) return;
            const sheet = appData.sheets[currentSheetIndex];
            const colName = sheet.columns[cIdx] || "";
            if (colName.includes("開始") || colName.includes("完成") || colName.toLowerCase().includes("start") || colName.toLowerCase().includes("end")) {
                val = formatDateClean(val);
            }
            sheet.rows[rIdx][cIdx] = val;
            saveToCloud();
            renderApp();
        }

        function addColumn() {
            if (!isLoggedIn) return;
            const colName = prompt("請輸入新欄位名稱：", "欄位");
            if (!colName) return;
            appData.sheets[currentSheetIndex].columns.push(formatHeaderClean(colName));
            appData.sheets[currentSheetIndex].rows.forEach(row => row.push(""));
            saveToCloud();
            renderApp();
        }

        function deleteColumn(cIdx) {
            if (!isLoggedIn) return;
            if (appData.sheets[currentSheetIndex].columns.length <= 1) {
                alert("至少需要保留一個欄位！");
                return;
            }
            appData.sheets[currentSheetIndex].columns.splice(cIdx, 1);
            appData.sheets[currentSheetIndex].rows.forEach(row => row.splice(cIdx, 1));
            saveToCloud();
            renderApp();
        }

        function addRow() {
            if (!isLoggedIn) return;
            const emptyRow = new Array(appData.sheets[currentSheetIndex].columns.length).fill("");
            appData.sheets[currentSheetIndex].rows.push(emptyRow);
            saveToCloud();
            renderApp();
        }

        function deleteRow(rIdx) {
            if (!isLoggedIn) return;
            appData.sheets[currentSheetIndex].rows.splice(rIdx, 1);
            saveToCloud();
            renderApp();
        }

        function getDynamicTimelineRange(sheetRows, columns) {
            let minYear = 2026;
            let maxYear = 2027;

            const dateIndices = [];
            columns.forEach((c, idx) => {
                if (c.includes("開始") || c.includes("完成") || c.toLowerCase().includes("start") || c.toLowerCase().includes("end") || c.toLowerCase().includes("date")) {
                    dateIndices.push(idx);
                }
            });

            sheetRows.forEach(row => {
                dateIndices.forEach(idx => {
                    const dateStr = row[idx];
                    if (dateStr) {
                        const d = new Date(dateStr);
                        if (!isNaN(d.getTime())) {
                            const y = d.getFullYear();
                            if (y < minYear) minYear = y;
                            if (y > maxYear) maxYear = y;
                        }
                    }
                });
            });

            const months = [];
            for (let y = minYear; y <= maxYear; y++) {
                const mNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                for (let m = 1; m <= 12; m++) {
                    months.push({ year: y, name: mNames[m-1], monthNum: m });
                }
            }

            const timelineStart = new Date(`${minYear}-01-01`).getTime();
            const timelineEnd = new Date(`${maxYear}-12-31`).getTime();

            return { minYear, maxYear, months, timelineStart, timelineEnd };
        }

        function renderGanttChart() {
            const sheet = appData.sheets[currentSheetIndex];
            const container = document.getElementById('gantt-container');
            container.innerHTML = '';

            const { minYear, maxYear, months, timelineStart, timelineEnd } = getDynamicTimelineRange(sheet.rows, sheet.columns);
            const totalMs = timelineEnd - timelineStart;

            // 動態尋找各欄位索引（具備強大容錯機制，即使欄位順序變動或未填也能正確抓取）
            const colDept = sheet.columns.findIndex(c => c.includes("部門") || c.toLowerCase().includes("dept"));
            const colClass = sheet.columns.findIndex(c => c.includes("課") || c.toLowerCase().includes("class"));
            const colMachine = sheet.columns.findIndex(c => c.includes("機台") || c.toLowerCase().includes("machine") || c.toLowerCase().includes("item"));
            const colQty = sheet.columns.findIndex(c => c.includes("數量") || c.toLowerCase().includes("qty") || c.toLowerCase().includes("quantity"));
            const colLocation = sheet.columns.findIndex(c => c.includes("位置") || c.toLowerCase().includes("location"));
            const colType = sheet.columns.findIndex(c => c.includes("類別") || c.toLowerCase().includes("type") || c.toLowerCase().includes("status"));
            const colStart = sheet.columns.findIndex(c => c.includes("開始") || c.toLowerCase().includes("start"));
            const colEnd = sheet.columns.findIndex(c => c.includes("完成") || c.toLowerCase().includes("end") || c.toLowerCase().includes("complete"));
            const colRemark = sheet.columns.findIndex(c => c.includes("備註") || c.toLowerCase().includes("remark") || c.toLowerCase().includes("note"));

            const machineMap = {};
            sheet.rows.forEach(row => {
                const dept = colDept !== -1 ? (row[colDept] || '') : (row[0] || '');
                const clazz = colClass !== -1 ? (row[colClass] || '') : (row[1] || '');
                const machine = colMachine !== -1 ? (row[colMachine] || '未命名機台') : (row[2] || '未命名機台');
                const qty = colQty !== -1 ? (row[colQty] || '') : '';
                const location = colLocation !== -1 ? (row[colLocation] || '') : '';
                const remark = colRemark !== -1 ? (row[colRemark] || '') : '';
                
                // 修正：以資料列本身的識別值作為群組依據（即使擺放位置空白或隨後變動也不會造成甘特圖錯亂）
                const key = `${rIdx}_${machine}_${location}`;
                if (!machineMap[key]) {
                    machineMap[key] = { dept, clazz, machine, qty, location, remark, items: [] };
                }
                machineMap[key].items.push(row);
            });

            // 重新修正迴圈中的 row 索引對應
            let rowIndexCounter = 0;
            const updatedMachineMap = {};
            sheet.rows.forEach(row => {
                const dept = colDept !== -1 ? (row[colDept] || '') : (row[0] || '');
                const clazz = colClass !== -1 ? (row[colClass] || '') : (row[1] || '');
                const machine = colMachine !== -1 ? (row[colMachine] || '未命名機台') : (row[2] || '未命名機台');
                const qty = colQty !== -1 ? (row[colQty] || '') : '';
                const location = colLocation !== -1 ? (row[colLocation] || '') : '';
                const remark = colRemark !== -1 ? (row[colRemark] || '') : '';
                
                const key = `row_${rowIndexCounter++}_${machine}`;
                if (!updatedMachineMap[key]) {
                    updatedMachineMap[key] = { dept, clazz, machine, qty, location, remark, items: [] };
                }
                updatedMachineMap[key].items.push(row);
            });

            let tableHtml = `<div class="overflow-x-auto border rounded-xl bg-white shadow-sm">
                <table class="w-full border-collapse text-xs min-w-[${months.length * 60 + 250}px]">
                    <thead>
                        <tr class="bg-gray-50 border-b text-gray-500">
                            <th class="py-2.5 px-4 text-left border-r w-72">項目 / 資訊</th>`;
            
            for (let y = minYear; y <= maxYear; y++) {
                tableHtml += `<th class="py-1 px-1 border-r text-center bg-gray-100/50" colspan="12">${y}</th>`;
            }

            tableHtml += `</tr><tr class="bg-gray-50 border-b text-gray-600 font-medium">

            months.forEach(m => {

            function dateToPercent(dateStr) {
                if (!dateStr) return 0;
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return 0;
                let diff = d.getTime() - timelineStart;
                let pct = (diff / totalMs) * 100;
                return Math.max(0, Math.min(100, pct));
            }

            Object.values(updatedMachineMap).forEach(group => {
                let planItem = null;
                let activeItem = null;

                group.items.forEach(row => {
                    const type = colType !== -1 ? String(row[colType] || '') : String(row[3] || '');
                    if (type.includes('計畫')) planItem = row;
                    else if (type.includes('進行中')) activeItem = row;
                });

                const renderBar = (item, defaultColor, topClass) => {
                    if (!item) return '';
                    const startVal = colStart !== -1 ? item[colStart] : item[4];
                    const endVal = colEnd !== -1 ? item[colEnd] : item[5];
                    const startPct = dateToPercent(startVal);
                    const endPct = endVal ? dateToPercent(endVal) : Math.min(100, startPct + 10);
                    const widthPct = Math.max(3, endPct - startPct);

                    let barColor = defaultColor;
                    const typeStr = colType !== -1 ? String(item[colType] || '').trim() : String(item[3] || '').trim();
                    let labelText = typeStr;
                    
                    if (typeStr.includes('落後')) {
                        barColor = 'bg-rose-500';
                        labelText = '落後';
                    } else if (typeStr.includes('已完成') || typeStr.includes('完成')) {
                        barColor = 'bg-cyan-500';
                        labelText = '已完成';
                    } else if (typeStr.includes('進行中')) {
                        barColor = 'bg-emerald-500';
                        labelText = '進行中';
                    } else if (typeStr.includes('計畫')) {
                        barColor = 'bg-amber-400';
                        labelText = '計畫';
                    }

                    return `<div class="absolute ${topClass} h-6 rounded-md ${barColor} shadow-sm flex items-center justify-start px-2.5 text-[11px] text-white font-bold overflow-hidden" style="left: ${startPct}%; width: ${widthPct}%;">
                        <span class="whitespace-nowrap drop-shadow-sm leading-none">${labelText}</span>
                    </div>`;
                };

                const qtyText = group.qty ? ` (數量: ${group.qty})` : '';
                const locText = group.location ? ` | 位置: ${group.location}` : '';
                const remarkText = group.remark ? `<div class="text-[11px] text-blue-600 font-medium">備註: ${group.remark}</div>` : '';

                tableHtml += `<tr class="hover:bg-gray-50/80 transition">
                    <td class="py-3 px-4 border-r align-middle w-72">
                        <div class="font-bold text-gray-800 text-sm">${group.machine}${qtyText}</div>
                        <div class="text-[11px] text-gray-500">${group.dept} / ${group.clazz}${locText}</div>
                        ${remarkText}
                    </td>`;

                tableHtml += `<td colspan="${months.length}" class="p-0 relative h-20">
                    <div class="absolute inset-0 grid grid-cols-${months.length} pointer-events-none" style="grid-template-columns: repeat(${months.length}, minmax(0, 1fr));">`;
                for(let i=0; i<months.length; i++) {
                    tableHtml += `<div class="border-r border-gray-100 h-full"></div>`;
                }
                tableHtml += `</div>
                    ${renderBar(planItem, 'bg-amber-400', 'top-2')}
                    ${renderBar(activeItem, 'bg-emerald-500', 'top-10')}
                </td>`;

                tableHtml += `</tr>`;
            });

            tableHtml += `</tbody></table></div>`;
            container.innerHTML = tableHtml;
        }

                scale: 2, 
                useCORS: true,
                logging: false,
                windowWidth: element.scrollWidth
            }).then(canvas => {
                exportBtn.style.display = 'inline-block';
                const link = document.createElement('a');
                link.download = `${appData.sheets[currentSheetIndex].name}-跨年甘特圖.png`;

        function exportExcel() {
            const wb = XLSX.utils.book_new();
            appData.sheets.forEach(sheet => {
                const wsData = [sheet.columns, ...sheet.rows];
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                XLSX.utils.book_append_sheet(wb, ws, sheet.name);
            });
            XLSX.writeFile(wb, "機台擴張甘特圖資料.xlsx");
        }

        function importExcel(event) {
            if (!isLoggedIn) return;
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const workbook = XLSX.read(e.target.result, { type: 'binary', cellDates: true });
                const newSheets = [];
                workbook.SheetNames.forEach(sheetName => {
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "" });
                    if (json && json.length > 0) {
                        let hIdx = json.findIndex(row => row.some(cell => cell !== ""));
                        if (hIdx === -1) return;
                        
                        const columns = json[hIdx].map(c => formatHeaderClean(c)).filter(c => c !== "");
                        const rows = json.slice(hIdx + 1).filter(row => row.some(c => c !== "")).map(row => {
                            return columns.map((colName, i) => {
                                let val = row[i] !== undefined ? row[i] : "";
                                if (colName.includes("開始") || colName.includes("完成") || colName.toLowerCase().includes("start") || colName.toLowerCase().includes("end")) {
                                    val = formatDateClean(val);
                                }
                                return String(val);
                            });
                        });
                        
                        newSheets.push({ name: sheetName, columns, rows: rows.length > 0 ? rows : [new Array(columns.length).fill("")], notes: {} });
                    }
                });
                if (newSheets.length > 0) {
                    appData.sheets = newSheets;
                    currentSheetIndex = 0;
                    saveToCloud();
                    renderApp();
                    alert("🎉 匯入 Excel 成功！");
                }
            };
            reader.readAsBinaryString(file);
        }
