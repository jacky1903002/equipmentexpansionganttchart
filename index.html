<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機台擴張甘特圖管理系統 - 雲端授權版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Firebase SDK (Compat 版本) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans antialiased relative">

    <!-- 登入覆蓋遮罩 (預設顯示) -->
    <div id="login-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 space-y-6">
            <div class="text-center space-y-2">
                <span class="text-4xl">🔐</span>
                <h2 class="text-xl font-bold text-gray-800">系統登入驗證</h2>
                <p class="text-xs text-gray-500">請輸入 Firebase 電子郵件與密碼以解鎖編輯功能</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">電子郵件 (Email)</label>
                    <input type="email" id="login-email" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="name@example.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">密碼 (Password)</label>
                    <input type="password" id="login-pass" class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="請輸入密碼">
                </div>
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-700 transition shadow-md">登入系統</button>
                <div id="login-error" class="text-xs text-rose-500 text-center font-medium hidden"></div>
            </div>
            <div class="text-center">
                <button onclick="enterAsGuest()" class="text-xs text-gray-500 hover:text-gray-700 underline">以訪客模式檢視（僅能查看與匯出）</button>
            </div>
        </div>
    </div>

    <!-- 主應用程式介面 -->
    <div class="flex flex-col min-h-screen">
        <header class="bg-white shadow px-6 py-4 flex justify-between items-center border-b">
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <span>☁️</span> 機台擴張甘特圖管理系統 <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-normal">雲端授權版</span>
            </h1>
            <div class="flex items-center space-x-4">
                <span id="sync-status" class="text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-medium">⏳ 連線中...</span>
                <span id="auth-status-badge" class="text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded-full font-semibold">🔒 訪客模式 (唯讀)</span>
                <button id="logout-btn" onclick="handleLogout()" class="hidden text-xs bg-rose-100 text-rose-700 px-3 py-1 rounded-full font-semibold hover:bg-rose-200 transition">登出</button>
            </div>
        </header>

        <!-- 分頁與工作表操作 -->
        <div class="bg-white border-b px-6 py-3 flex flex-wrap items-center justify-between gap-4">
            <div id="sheets-tabs" class="flex items-center space-x-2 overflow-x-auto pb-1"></div>
            <div id="admin-sheet-controls" class="flex items-center space-x-2 opacity-50 pointer-events-none">
                <button onclick="addNewSheet()" class="bg-emerald-600 text-white px-3.5 py-1.5 rounded-lg text-sm hover:bg-emerald-700 transition shadow-sm">+ 新增工作表</button>
                <button onclick="deleteCurrentSheet()" class="bg-rose-500 text-white px-3.5 py-1.5 rounded-lg text-sm hover:bg-rose-600 transition shadow-sm">刪除工作表</button>
            </div>
        </div>

        <!-- 檔案與截圖匯出列 -->
        <div class="bg-gray-50 px-6 py-3 border-b flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <label id="import-file-label" class="bg-gray-400 text-white px-4 py-2 rounded-lg text-sm cursor-not-allowed flex items-center gap-1.5 font-medium select-none">
                    📁 匯入 Excel <input type="file" id="excel-file-input" class="hidden" accept=".xlsx, .xls, .csv" disabled onchange="importExcel(event)">
                </label>
                <button onclick="exportExcel()" class="bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm hover:bg-emerald-800 transition shadow-sm font-medium">📥 匯出 Excel</button>
            </div>
        </div>

        <!-- 主內容區 -->
        <main class="flex-1 p-6 space-y-6 bg-gray-100 overflow-y-auto">
            <!-- 資料表格編輯區 -->
            <div id="table-container-wrapper" class="bg-white rounded-xl shadow-sm border p-4 transition">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="current-sheet-title" class="text-base font-bold text-gray-800">工作表名稱</h3>
                    <div class="space-x-2">
                        <button onclick="addColumn()" class="bg-blue-600 text-white px-3 py-1 rounded text-xs hover:bg-blue-700 transition">+ 新增欄位</button>
                        <button onclick="addRow()" class="bg-purple-600 text-white px-3 py-1 rounded text-xs hover:bg-purple-700 transition">+ 新增列位</button>
                    </div>
                </div>
                <div class="overflow-x-auto overflow-y-auto border rounded-lg" style="max-height: 300px;">
                    <table id="data-table" class="min-w-full divide-y divide-gray-200 text-xs"></table>
                </div>
            </div>

            <!-- 甘特圖預覽區 -->
            <div id="gantt-export-area" class="bg-white rounded-xl shadow-sm border p-6 relative">
                <div class="flex justify-between items-center mb-4 flex-wrap gap-3">
                    <h3 class="text-base font-bold text-gray-800">📈 甘特圖與月份矩陣預覽</h3>
                    <div class="flex items-center space-x-4 flex-wrap gap-2">
                        <div class="flex items-center space-x-3 text-xs bg-gray-50 px-3 py-1.5 rounded-lg border">
                            <span class="flex items-center"><span class="w-3 h-3 bg-sky-300 border border-sky-500 inline-block mr-1 rounded"></span>計畫</span>
                            <span class="flex items-center"><span class="w-3 h-3 bg-emerald-500 inline-block mr-1 rounded"></span>實際正常</span>
                            <span class="flex items-center"><span class="w-3 h-3 bg-rose-500 inline-block mr-1 rounded"></span>實際落後</span>
                            <span class="flex items-center"><span class="w-3 h-3 bg-purple-600 inline-block mr-1 rounded"></span>已完成</span>
                        </div>
                        <button id="export-btn" onclick="exportGanttPNG()" class="bg-blue-600 text-white px-3.5 py-1.5 rounded-lg text-xs hover:bg-blue-700 transition shadow-sm font-medium">匯出 PNG</button>
                    </div>
                </div>
                <div id="gantt-container" class="space-y-4 overflow-x-auto py-2"></div>
            </div>
        </main>
    </div>

    <!-- 邏輯腳本 -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC0sT-i0AwNH9utv5JFVZ1HfXXoRDVQyYs",
            authDomain: "equipmentexpansionganttchart.firebaseapp.com",
            databaseURL: "https://equipmentexpansionganttchart-default-rtdb.firebaseio.com",
            projectId: "equipmentexpansionganttchart",
            storageBucket: "equipmentexpansionganttchart.firebasestorage.app",
            messagingSenderId: "357406784955",
            appId: "1:357406784955:web:e3661233994a32196e589e",
            measurementId: "G-HYXNC4YZ19"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const rtdb = firebase.database();

        let appData = { sheets: [] };
        let currentSheetIndex = 0;
        let isLoggedIn = false;

        window.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged((user) => {
                isLoggedIn = !!user;
                updateUIPermissions();
            });
            loadFromCloud();
        });

        function formatDateClean(val) {
            if (!val) return "";
            const str = String(val).trim();
            const d = new Date(str);
            if (!isNaN(d.getTime()) && (str.includes("GMT") || str.includes("T") || str.length > 10)) {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                if (year >= 2000 && year <= 2100) {
                    return `${year}/${month}/${day}`;
                }
            }
            return str;
        }

        function formatHeaderClean(val) {
            if (!val) return "";
            const str = String(val).trim();
            const d = new Date(str);
            if (!isNaN(d.getTime()) && (str.includes("GMT") || str.includes("T") || str.length > 10)) {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                if (year >= 2000 && year <= 2100) {
                    return `${year}/${month}/${day}`;
                }
            }
            return str;
        }

        function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const errEl = document.getElementById('login-error');

            if (!email || !pass) {
                errEl.innerText = "請輸入電子郵件與密碼！";
                errEl.classList.remove('hidden');
                return;
            }

            auth.signInWithEmailAndPassword(email, pass)
                .then(() => {
                    document.getElementById('login-modal').classList.add('hidden');
                    errEl.classList.add('hidden');
                })
                .catch((error) => {
                    console.error(error);
                    errEl.innerText = "登入失敗：請確認 Email 與密碼是否正確。";
                    errEl.classList.remove('hidden');
                });
        }

        function enterAsGuest() {
            document.getElementById('login-modal').classList.add('hidden');
            updateUIPermissions();
        }

        function handleLogout() {
            auth.signOut().then(() => {
                document.getElementById('login-email').value = "";
                document.getElementById('login-pass').value = "";
                document.getElementById('login-modal').classList.remove('hidden');
                updateUIPermissions();
            });
        }

        function updateUIPermissions() {
            const badge = document.getElementById('auth-status-badge');
            const logoutBtn = document.getElementById('logout-btn');
            const adminSheetControls = document.getElementById('admin-sheet-controls');
            const importLabel = document.getElementById('import-file-label');
            const fileInput = document.getElementById('excel-file-input');
            const tableWrapper = document.getElementById('table-container-wrapper');

            if (isLoggedIn) {
                badge.className = "text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-semibold";
                badge.innerText = "🔓 管理者模式 (已解鎖)";
                logoutBtn.classList.remove('hidden');
                
                adminSheetControls.classList.remove('opacity-50', 'pointer-events-none');
                importLabel.className = "bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm cursor-pointer hover:bg-indigo-700 transition shadow-sm flex items-center gap-1.5 font-medium";
                fileInput.disabled = false;
                tableWrapper.classList.remove('opacity-65', 'pointer-events-none');
            } else {
                badge.className = "text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded-full font-semibold";
                badge.innerText = "🔒 訪客模式 (唯讀)";
                logoutBtn.classList.add('hidden');

                adminSheetControls.classList.add('opacity-50', 'pointer-events-none');
                importLabel.className = "bg-gray-400 text-white px-4 py-2 rounded-lg text-sm cursor-not-allowed flex items-center gap-1.5 font-medium select-none";
                fileInput.disabled = true;
                tableWrapper.classList.add('opacity-65', 'pointer-events-none');
            }
        }

        function loadFromCloud() {
            const statusEl = document.getElementById('sync-status');
            rtdb.ref('ganttSystem/mainData').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.sheets) {
                    appData = data;
                    appData.sheets.forEach(sheet => {
                        if (!sheet.notes) sheet.notes = {};
                        sheet.columns = sheet.columns.map(col => formatHeaderClean(col));
                        sheet.rows.forEach(row => {
                            if (row.length > 4) {
                                row[4] = formatDateClean(row[4]);
                                row[5] = formatDateClean(row[5]);
                            }
                        });
                    });
                    statusEl.className = "text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-medium";
                    statusEl.innerText = "✅ 已連線雲端資料庫";
                } else {
                    appData = {
                        sheets: [{
                            name: "機台擴張排程",
                            columns: ["部門", "課別", "機台", "類別", "開始日期", "完成日期", "2026/01/01", "2026/02/01", "2026/03/01", "2026/04/01", "2026/05/01", "2026/06/01", "2026/07/01", "2026/08/01", "2026/09/01", "2026/10/01", "2026/11/01", "2026/12/01"],
                            rows: [
                                ["製造一部", "金屬一課", "自動化銑床1:4", "計畫", "2026/01/01", "2026/08/15", "1", "1", "1", "1", "1", "1", "1", "1", "", "", "", ""],
                                ["製造一部", "金屬一課", "自動化銑床1:4", "實際", "2026/03/01", "", "", "", "1", "1", "1", "1", "1", "1", "", "", "", ""],
                                ["製造二部", "金屬二課", "銑床改3+1", "計畫", "2026/01/01", "2026/03/15", "1", "1", "1", "", "", "", "", "", "", "", "", ""],
                                ["製造二部", "金屬二課", "銑床改3+1", "實際", "2026/01/01", "2026/03/15", "1", "1", "1", "", "", "", "", "", "", "", "", ""],
                                ["製造二部", "金屬二課", "銑床改3+2", "計畫", "2026/02/01", "2026/04/15", "", "1", "1", "1", "", "", "", "", "", "", "", ""],
                                ["製造二部", "金屬二課", "銑床改3+2", "實際", "2026/01/30", "", "1", "1", "1", "1", "", "", "", "", "", "", "", ""],
                                ["製造二部", "金屬三課", "銑床改3+4", "計畫", "2026/02/01", "2026/04/15", "", "1", "1", "1", "", "", "", "", "", "", "", ""],
                                ["製造二部", "金屬三課", "銑床改3+4", "實際", "2026/01/30", "", "", "1", "1", "1", "1", "1", "", "", "", "", "", ""],
                            ],
                            notes: {}
                        }]
                    };
                    saveToCloud();
                }
                renderApp();
            });
        }

        function saveToCloud() {
            if (!isLoggedIn) return;
            rtdb.ref('ganttSystem/mainData').set(appData);
        }

        function renderApp() {
            renderSheetsTabs();
            renderTable();
            renderGanttChart();
        }

        function renderSheetsTabs() {
            const container = document.getElementById('sheets-tabs');
            container.innerHTML = '';
            appData.sheets.forEach((sheet, idx) => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-1.5 rounded-lg text-sm font-semibold transition shadow-sm ${idx === currentSheetIndex ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`;
                btn.innerText = sheet.name;
                btn.onclick = () => { currentSheetIndex = idx; renderApp(); };
                if (isLoggedIn) {
                    btn.ondblclick = () => {
                        const newName = prompt("重新命名工作表：", sheet.name);
                        if (newName && newName.trim() !== "") {
                            sheet.name = newName.trim();
                            saveToCloud();
                            renderApp();
                        }
                    };
                }
                container.appendChild(btn);
            });
            document.getElementById('current-sheet-title').innerText = appData.sheets[currentSheetIndex].name;
        }

        function addNewSheet() {
            if (!isLoggedIn) return;
            const name = prompt("請輸入新工作表名稱：", `工作表 ${appData.sheets.length + 1}`);
            if (!name) return;
            appData.sheets.push({
                name: name.trim(),
                columns: ["部門", "課別", "機台", "類別", "開始日期", "完成日期", "2026/01/01", "2026/02/01"],
                rows: [["部門A", "課別A", "機台A", "計畫", "2026/01/01", "2026/02/01", "1", "1"]],
                notes: {}
            });
            currentSheetIndex = appData.sheets.length - 1;
            saveToCloud();
            renderApp();
        }

        function deleteCurrentSheet() {
            if (!isLoggedIn) return;
            if (appData.sheets.length <= 1) {
                alert("至少需要保留一個工作表！");
                return;
            }
            if (confirm(`確定要刪除工作表「${appData.sheets[currentSheetIndex].name}」嗎？`)) {
                appData.sheets.splice(currentSheetIndex, 1);
                currentSheetIndex = Math.max(0, currentSheetIndex - 1);
                saveToCloud();
                renderApp();
            }
        }

        function renderTable() {
            const sheet = appData.sheets[currentSheetIndex];
            const table = document.getElementById('data-table');
            let html = '<thead class="bg-gray-50 sticky top-0 z-10"><tr>';
            
            sheet.columns.forEach((col, cIdx) => {
                html += `<th class="px-3 py-2 text-left font-medium text-gray-600 uppercase tracking-wider border-b">
                    <div class="flex items-center space-x-1">
                        <input type="text" value="${col}" ${!isLoggedIn ? 'disabled' : ''} onchange="updateColumnName(${cIdx}, this.value)" class="bg-transparent border-b border-gray-300 focus:outline-none focus:border-blue-500 w-full" />
                        ${isLoggedIn ? `<button onclick="deleteColumn(${cIdx})" class="text-red-500 hover:text-red-700 text-xs px-1">✕</button>` : ''}
                    </div>
                </th>`;
            });
            if (isLoggedIn) html += '<th class="px-3 py-2 text-center font-medium text-gray-600 uppercase tracking-wider border-b">操作</th>';
            html += '</tr></thead>';
            
            html += '<tbody class="bg-white divide-y divide-gray-200">';
            sheet.rows.forEach((row, rIdx) => {
                html += '<tr class="hover:bg-gray-50 transition">';
                sheet.columns.forEach((_, cIdx) => {
                    const val = row[cIdx] !== undefined ? row[cIdx] : '';
                    html += `<td class="px-3 py-1.5 whitespace-nowrap border-b">
                        <input type="text" value="${val}" ${!isLoggedIn ? 'disabled' : ''} oninput="updateCellInstant(${rIdx}, ${cIdx}, this.value)" onchange="updateCell(${rIdx}, ${cIdx}, this.value)" class="w-full bg-transparent border-none focus:outline-none" />
                    </td>`;
                });
                if (isLoggedIn) {
                    html += `<td class="px-3 py-1.5 whitespace-nowrap text-center border-b">
                        <button onclick="deleteRow(${rIdx})" class="text-red-600 hover:text-red-900 text-xs font-semibold">刪除</button>
                    </td>`;
                }
                html += '</tr>';
            });
            html += '</tbody>';
            table.innerHTML = html;
        }

        function updateColumnName(cIdx, val) {
            if (!isLoggedIn) return;
            appData.sheets[currentSheetIndex].columns[cIdx] = formatHeaderClean(val);
            saveToCloud();
            renderApp();
        }

        function updateCellInstant(rIdx, cIdx, val) {
            appData.sheets[currentSheetIndex].rows[rIdx][cIdx] = val;
            renderGanttChart();
        }

        function updateCell(rIdx, cIdx, val) {
            if (!isLoggedIn) return;
            if (cIdx === 4 || cIdx === 5) {
                val = formatDateClean(val);
            }
            appData.sheets[currentSheetIndex].rows[rIdx][cIdx] = val;
            saveToCloud();
            renderApp();
        }

        function updateMachineNote(machineKey, val) {
            if (!isLoggedIn) return;
            const sheet = appData.sheets[currentSheetIndex];
            if (!sheet.notes) sheet.notes = {};
            sheet.notes[machineKey] = val;
            saveToCloud();
        }

        function addColumn() {
            if (!isLoggedIn) return;
            const colName = prompt("請輸入新欄位名稱 (例如 2026/01/01)：", "2026/01/01");
            if (!colName) return;
            appData.sheets[currentSheetIndex].columns.push(formatHeaderClean(colName));
            appData.sheets[currentSheetIndex].rows.forEach(row => row.push(""));
            saveToCloud();
            renderApp();
        }

        function deleteColumn(cIdx) {
            if (!isLoggedIn) return;
            if (appData.sheets[currentSheetIndex].columns.length <= 1) {
                alert("至少需要保留一個欄位！");
                return;
            }
            appData.sheets[currentSheetIndex].columns.splice(cIdx, 1);
            appData.sheets[currentSheetIndex].rows.forEach(row => row.splice(cIdx, 1));
            saveToCloud();
            renderApp();
        }

        function addRow() {
            if (!isLoggedIn) return;
            const emptyRow = new Array(appData.sheets[currentSheetIndex].columns.length).fill("");
            appData.sheets[currentSheetIndex].rows.push(emptyRow);
            saveToCloud();
            renderApp();
        }

        function deleteRow(rIdx) {
            if (!isLoggedIn) return;
            appData.sheets[currentSheetIndex].rows.splice(rIdx, 1);
            saveToCloud();
            renderApp();
        }

        function renderGanttChart() {
            const sheet = appData.sheets[currentSheetIndex];
            const container = document.getElementById('gantt-container');
            container.innerHTML = '';

            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const today = new Date();

            function parseDateValue(value) {
                if (value === null || value === undefined) return null;
                const raw = String(value).trim();
                if (!raw) return null;

                const monthMap = {
                    Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5,
                    Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11
                };

                const shortMonth = raw.match(/^([A-Za-z]{3})-(\d{2,4})$/i);
                if (shortMonth) {
                    const monthKey = shortMonth[1].charAt(0).toUpperCase() + shortMonth[1].slice(1).toLowerCase();
                    const monthIndex = monthMap[monthKey];
                    if (monthIndex !== undefined) {
                        const rawYear = shortMonth[2];
                        const year = rawYear.length === 2 ? 2000 + Number(rawYear) : Number(rawYear);
                        return new Date(year, monthIndex, 1);
                    }
                }

                const normalized = raw.replace(/-/g, '/');
                const direct = new Date(normalized);
                if (!isNaN(direct.getTime())) return direct;

                const match = normalized.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
                if (match) {
                    const year = Number(match[3].length === 2 ? '20' + match[3] : match[3]);
                    const month = Number(match[1]) - 1;
                    const day = Number(match[2]);
                    return new Date(year, month, day);
                }

                const iso = new Date(raw);
                if (!isNaN(iso.getTime())) return iso;
                return null;
            }

            function monthDisplayName(date) {
                return monthNames[date.getMonth()];
            }

            function resolveMonthSequence() {
                const monthDateColumns = [];
                sheet.columns.forEach((col, idx) => {
                    if (idx < 6) return;
                    const parsed = parseDateValue(col);
                    if (parsed) {
                        monthDateColumns.push(parsed);
                    }
                });

                let start = new Date(2026, 0, 1);
                let end = new Date(2026, 11, 31);

                if (monthDateColumns.length > 0) {
                    const sorted = monthDateColumns.sort((a, b) => a - b);
                    start = new Date(sorted[0].getFullYear(), sorted[0].getMonth(), 1);
                    end = new Date(sorted[sorted.length - 1].getFullYear(), sorted[sorted.length - 1].getMonth(), 31);
                }

                const months = [];
                const cursor = new Date(start.getFullYear(), start.getMonth(), 1);
                const last = new Date(end.getFullYear(), end.getMonth(), 1);
                while (cursor <= last) {
                    months.push(new Date(cursor));
                    cursor.setMonth(cursor.getMonth() + 1);
                }

                return { start, end, months };
            }

            function resolveTaskDates(taskRow) {
                let start = parseDateValue(taskRow[4]);
                let end = parseDateValue(taskRow[5]);

                if ((!start || !end) && taskRow.length > 6) {
                    const activeMonths = [];
                    sheet.columns.forEach((col, idx) => {
                        if (idx < 6) return;
                        const val = taskRow[idx];
                        const valueText = String(val ?? '').trim();
                        if (valueText && valueText !== '0') {
                            const parsed = parseDateValue(col);
                            if (parsed) activeMonths.push(parsed);
                        }
                    });

                    if (activeMonths.length > 0) {
                        const ordered = activeMonths.sort((a, b) => a - b);
                        if (!start) start = new Date(ordered[0].getFullYear(), ordered[0].getMonth(), 1);
                        if (!end) end = new Date(ordered[ordered.length - 1].getFullYear(), ordered[ordered.length - 1].getMonth(), 1);
                    }
                }

                if (!start && !end) return { start: null, end: null };
                if (!start && end) start = new Date(end.getFullYear(), end.getMonth(), 1);
                if (!end && start) end = new Date(start.getFullYear(), start.getMonth(), 1);
                return { start, end };
            }

            function determineActualStatus(planRow, actualRow) {
                if (!actualRow) return null;

                const planDates = resolveTaskDates(planRow);
                const actualDates = resolveTaskDates(actualRow);

                if (!actualDates.start || !actualDates.end) {
                    return null;
                }

                const actualEnd = actualDates.end;
                const planEnd = planDates.end;

                const hasEndDate = actualRow[5] && String(actualRow[5]).trim() !== '';

                if (hasEndDate) {
                    if (actualEnd > planEnd) {
                        return 'delayed';
                    } else {
                        return 'completed';
                    }
                } else {
                    if (today > planEnd) {
                        return 'delayed';
                    } else {
                        return 'normal';
                    }
                }
            }

            const { start: rangeStart, end: rangeEnd, months } = resolveMonthSequence();
            const monthWidth = 90;
            const ganttWidth = months.length * monthWidth;

            const headerWrap = document.createElement('div');
            headerWrap.style.display = 'flex';
            headerWrap.style.width = `${180 + ganttWidth}px`;
            headerWrap.style.marginBottom = '8px';

            const leftHeader = document.createElement('div');
            leftHeader.style.width = '180px';
            leftHeader.style.padding = '10px 12px';
            leftHeader.style.border = '1px solid #dfe5eb';
            leftHeader.style.borderRight = 'none';
            leftHeader.style.borderRadius = '8px 0 0 0';
            leftHeader.style.background = '#f8fafc';
            leftHeader.style.fontSize = '11px';
            leftHeader.style.fontWeight = '700';
            leftHeader.style.color = '#475569';
            leftHeader.textContent = '任務';

            const rightHeader = document.createElement('div');
            rightHeader.style.width = `${ganttWidth}px`;
            rightHeader.style.border = '1px solid #dfe5eb';
            rightHeader.style.borderRadius = '0 8px 0 0';
            rightHeader.style.background = '#f8fafc';
            rightHeader.style.overflow = 'hidden';

            const quarterRow = document.createElement('div');
            quarterRow.style.display = 'flex';
            quarterRow.style.height = '30px';
            quarterRow.style.borderBottom = '1px solid #dfe5eb';

            let quarterIndex = 0;
            while (quarterIndex < months.length) {
                const chunkSize = Math.min(3, months.length - quarterIndex);
                const qCell = document.createElement('div');
                qCell.style.width = `${chunkSize * monthWidth}px`;
                qCell.style.display = 'flex';
                qCell.style.alignItems = 'center';
                qCell.style.justifyContent = 'center';
                qCell.style.fontSize = '12px';
                qCell.style.fontWeight = '700';
                qCell.style.color = '#475569';
                qCell.style.borderRight = '1px solid #dfe5eb';
                qCell.textContent = String(Math.floor(quarterIndex / 3) + 1).padStart(2, '0');
                quarterRow.appendChild(qCell);
                quarterIndex += chunkSize;
            }

            const monthRow = document.createElement('div');
            monthRow.style.display = 'flex';
            monthRow.style.height = '36px';

            months.forEach((monthDate) => {
                const cell = document.createElement('div');
                cell.style.width = `${monthWidth}px`;
                cell.style.display = 'flex';
                cell.style.alignItems = 'center';
                cell.style.justifyContent = 'center';
                cell.style.fontSize = '11px';
                cell.style.fontWeight = '700';
                cell.style.color = '#475569';
                cell.style.borderRight = '1px solid #dfe5eb';
                cell.textContent = monthDisplayName(monthDate);
                monthRow.appendChild(cell);
            });

            rightHeader.appendChild(quarterRow);
            rightHeader.appendChild(monthRow);
            headerWrap.appendChild(leftHeader);
            headerWrap.appendChild(rightHeader);
            container.appendChild(headerWrap);

            const groupMap = {};
            sheet.rows.forEach((row) => {
                const dept = row[0] || '';
                const clazz = row[1] || '';
                const machine = row[2] || '未命名機台';
                const key = `${dept}|${clazz}|${machine}`;

                if (!groupMap[key]) {
                    groupMap[key] = { dept, clazz, machine, rows: [] };
                }
                groupMap[key].rows.push(row);
            });

            const tableWrap = document.createElement('div');
            tableWrap.style.width = `${180 + ganttWidth}px`;
            tableWrap.style.border = '1px solid #dfe5eb';
            tableWrap.style.borderRadius = '10px';
            tableWrap.style.overflow = 'hidden';
            tableWrap.style.background = '#ffffff';

            const groups = Object.values(groupMap);
            groups.forEach((group) => {
                const row = document.createElement('div');
                row.style.display = 'flex';
                row.style.minHeight = '58px';
                row.style.borderBottom = '1px solid #e5e7eb';
                row.style.background = '#ffffff';

                const labelCell = document.createElement('div');
                labelCell.style.width = '180px';
                labelCell.style.padding = '12px 12px';
                labelCell.style.display = 'flex';
                labelCell.style.flexDirection = 'column';
                labelCell.style.justifyContent = 'center';
                labelCell.style.borderRight = '1px solid #e5e7eb';
                labelCell.style.background = '#f8fafc';
                labelCell.innerHTML = `<div style="font-size:15px; font-weight:700; color:#334155;">${group.machine}</div><div style="font-size:11px; color:#64748b; margin-top:2px;">${group.dept} / ${group.clazz}</div>`;

                const timelineCell = document.createElement('div');
                timelineCell.style.position = 'relative';
                timelineCell.style.width = `${ganttWidth}px`;
                timelineCell.style.height = '58px';
                timelineCell.style.background = 'linear-gradient(to right, rgba(148, 163, 184, 0.08), rgba(148, 163, 184, 0.02))';

                const grid = document.createElement('div');
                grid.style.position = 'absolute';
                grid.style.inset = '0';
                grid.style.display = 'flex';
                grid.style.pointerEvents = 'none';
                months.forEach(() => {
                    const cell = document.createElement('div');
                    cell.style.width = `${monthWidth}px`;
                    cell.style.borderRight = '1px solid rgba(148, 163, 184, 0.35)';
                    cell.style.height = '100%';
                    cell.style.background = 'rgba(255,255,255,0.12)';
                    grid.appendChild(cell);
                });
                timelineCell.appendChild(grid);

                const planRow = group.rows.find((r) => String(r[3] || '').includes('計畫')) || null;
                const actualRow = group.rows.find((r) => String(r[3] || '').includes('實際')) || null;

                const addMarker = (x, y, color) => {
                    const marker = document.createElement('div');
                    marker.style.position = 'absolute';
                    marker.style.left = `${x}px`;
                    marker.style.top = `${y}px`;
                    marker.style.width = '10px';
                    marker.style.height = '10px';
                    marker.style.background = color;
                    marker.style.transform = 'rotate(45deg)';
                    marker.style.border = '1px solid rgba(15, 23, 42, 0.35)';
                    marker.style.boxShadow = '0 1px 2px rgba(15, 23, 42, 0.15)';
                    timelineCell.appendChild(marker);
                };

                const addBar = (task, color, top, height, opacity = 1) => {
                    if (!task) return;
                    const dates = resolveTaskDates(task);
                    let startDate = dates.start;
                    let endDate = dates.end;
                    if (!startDate || !endDate) return;

                    if (endDate < startDate) {
                        const tmp = endDate;
                        endDate = startDate;
                        startDate = tmp;
                    }

                    const totalRangeMs = (rangeEnd.getTime() - rangeStart.getTime()) + 86400000;
                    const startMs = startDate.getTime() - rangeStart.getTime();
                    const endMs = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate() + 1).getTime() - rangeStart.getTime();
                    const left = (startMs / totalRangeMs) * ganttWidth;
                    const width = Math.max(((endMs - startMs) / totalRangeMs) * ganttWidth, 10);

                    const bar = document.createElement('div');
                    bar.style.position = 'absolute';
                    bar.style.left = `${left}px`;
                    bar.style.width = `${width}px`;
                    bar.style.top = `${top}px`;
                    bar.style.height = `${height}px`;
                    bar.style.borderRadius = '9999px';
                    bar.style.background = color;
                    bar.style.opacity = opacity;
                    bar.style.boxShadow = '0 3px 8px rgba(15, 23, 42, 0.12)';
                    bar.style.border = '1px solid rgba(15, 23, 42, 0.08)';
                    bar.style.zIndex = '2';
                    timelineCell.appendChild(bar);

                    addMarker(left, top + (height / 2) - 5, '#1f2937');
                    addMarker(left + Math.max(width - 10, 8), top + (height / 2) - 5, '#1f2937');
                };

                const planColor = '#93c5fd';
                
                let actualColor = '#5bc0be';
                const statusType = determineActualStatus(planRow, actualRow);
                if (statusType === 'delayed') {
                    actualColor = '#f26b6b';
                } else if (statusType === 'completed') {
                    actualColor = '#7f8cf7';
                } else if (statusType === 'normal') {
                    actualColor = '#5bc0be';
                }

                if (planRow) addBar(planRow, planColor, 12, 18, 1);
                if (actualRow) addBar(actualRow, actualColor, 26, 14, 0.95);

                row.appendChild(labelCell);
                row.appendChild(timelineCell);
                tableWrap.appendChild(row);
            });

            container.appendChild(tableWrap);
        }

        function exportGanttPNG() {
            const element = document.getElementById('gantt-export-area');
            const exportBtn = document.getElementById('export-btn');
            
            exportBtn.style.display = 'none';

            const noteInputs = element.querySelectorAll('input[data-note-input="true"]');
            const replacementMap = [];

            noteInputs.forEach(input => {
                const div = document.createElement('div');
                div.className = input.className + " flex items-center bg-white overflow-hidden";
                div.style.height = input.offsetHeight + "px";
                div.style.minHeight = "28px";
                div.style.lineHeight = "normal";
                div.style.padding = "4px 12px";
                div.style.boxSizing = "border-box";
                div.innerText = input.value || input.placeholder;
                if (!input.value) {
                    div.style.color = "#9ca3af";
                } else {
                    div.style.color = "#1f2937";
                }
                input.style.display = 'none';
                input.parentNode.insertBefore(div, input);
                replacementMap.push({ input, div });
            });

            html2canvas(element, { 
                scale: 2, 
                useCORS: true,
                logging: false,
                windowWidth: element.scrollWidth
            }).then(canvas => {
                replacementMap.forEach(item => {
                    item.input.style.display = '';
                    item.div.remove();
                });

                exportBtn.style.display = 'inline-block';
                const link = document.createElement('a');
                link.download = `${appData.sheets[currentSheetIndex].name}-甘特圖預覽.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error(err);
                replacementMap.forEach(item => {
                    item.input.style.display = '';
                    item.div.remove();
                });
                exportBtn.style.display = 'inline-block';
            });
        }

        function exportExcel() {
            const wb = XLSX.utils.book_new();
            appData.sheets.forEach(sheet => {
                const wsData = [sheet.columns, ...sheet.rows];
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                XLSX.utils.book_append_sheet(wb, ws, sheet.name);
            });
            XLSX.writeFile(wb, "機台擴張甘特圖資料.xlsx");
        }

        function importExcel(event) {
            if (!isLoggedIn) return;
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const workbook = XLSX.read(e.target.result, { type: 'binary', cellDates: true });
                const newSheets = [];
                workbook.SheetNames.forEach(sheetName => {
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, defval: "" });
                    if (json && json.length > 0) {
                        let hIdx = json.findIndex(row => row.some(cell => cell !== ""));
                        if (hIdx === -1) return;
                        
                        const columns = json[hIdx].map(c => formatHeaderClean(c)).filter(c => c !== "");
                        const rows = json.slice(hIdx + 1).filter(row => row.some(c => c !== "")).map(row => {
                            return columns.map((_, i) => {
                                let val = row[i] !== undefined ? row[i] : "";
                                if (i === 4 || i === 5) {
                                    val = formatDateClean(val);
                                }
                                return String(val);
                            });
                        });
                        
                        newSheets.push({ name: sheetName, columns, rows: rows.length > 0 ? rows : [new Array(columns.length).fill("")], notes: {} });
                    }
                });
                if (newSheets.length > 0) {
                    appData.sheets = newSheets;
                    currentSheetIndex = 0;
                    saveToCloud();
                    renderApp();
                    alert("🎉 匯入 Excel 成功！");
                }
            };
            reader.readAsBinaryString(file);
        }
    </script>
